<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worship Scheduler</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22201c;--accent:#7b5e3b;--line:#e3ded4}
@media(prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#252220;--ink:#f0ece5;--accent:#c9a877;--line:#3a3532}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
header{background:var(--card);padding:12px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px}h2{margin:10px 0;font-size:16px}h3{margin:12px 0 8px;font-size:14px}
main{max-width:800px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);padding:14px;margin:12px 0;border-radius:8px}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:6px;font-size:14px}
button{background:var(--accent);color:#fff;border:0;padding:10px;border-radius:6px;cursor:pointer;margin:4px 0;width:100%}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
label{display:block;margin:10px 0 2px;font-weight:600;font-size:12px;color:#999}
.chip{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:20px;margin:4px;cursor:pointer;background:var(--bg);font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav{padding:8px;display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{margin:0;padding:8px 12px;width:auto;font-size:13px}
.status{font-size:11px;color:#999;margin-top:4px}
.song{background:var(--bg);padding:10px;margin:8px 0;border-radius:6px}
.msg{background:var(--bg);padding:8px;margin:6px 0;border-radius:4px;font-size:12px}
.pending{background:#fff3cd;padding:12px;border-radius:6px;margin:8px 0;border-left:4px solid #ff9800}
.approved{background:#d4edda;padding:12px;border-radius:6px;margin:8px 0;border-left:4px solid #28a745}
.green{background:#28a745}.red{background:#c23b22}
.msg-ok{background:#e8f5e9;color:#2e7d32;padding:10px;border-radius:6px;margin:8px 0;border-left:4px solid #28a745}
.msg-err{background:#ffebee;color:#c62828;padding:10px;border-radius:6px;margin:8px 0;border-left:4px solid #c62828}
.msg-info{background:#fff3e0;color:#e65100;padding:10px;border-radius:6px;margin:8px 0;border-left:4px solid #ff9800}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px">
    <h1 style="margin:0">🎵 Worship Scheduler</h1>
    <span id="env-badge"></span>
  </div>
  <div id="uinfo" style="font-size:12px;color:#999;margin-top:4px"></div>
  <div class="status" id="synctxt">⏳ Starting...</div>
</header>
<nav id="mainnav"></nav>
<main id="main"></main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
var db, ref;
var fbReady = false;
var tab = "home";
var selDays = {};
var INST = ["Drums","Vocals","Bass Guitar","Acoustic Guitar","Piano","Media","Sound"];
var KEYS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

// -- EmailJS config (admin fills these in Settings tab) --
// Get free account at https://www.emailjs.com
// Store in Firebase so admin can set via UI
var EJS = { ready: false };
function initEmailJS(pubKey){ if(pubKey){ emailjs.init(pubKey); EJS.ready=true; } }

// ── Firebase configs ──────────────────────────────────────────────────────────
var FB_PROD = {
  apiKey:            "AIzaSyC4HnnRcChcof_s4XKE173GFrGwmR1vxSg",
  authDomain:        "elc-worship-schedule.firebaseapp.com",
  databaseURL:       "https://elc-worship-schedule-default-rtdb.firebaseio.com",
  projectId:         "elc-worship-schedule",
  storageBucket:     "elc-worship-schedule.firebasestorage.app",
  messagingSenderId: "868888139963",
  appId:             "1:868888139963:web:2d933464a111b2b17c319e"
};

// PASTE YOUR SANDBOX CONFIG HERE after creating elc-worship-dev in Firebase Console
var FB_SANDBOX = {
  apiKey:            "PASTE_SANDBOX_API_KEY_HERE",
  authDomain:        "elc-worship-dev.firebaseapp.com",
  databaseURL:       "https://elc-worship-dev-default-rtdb.firebaseio.com",
  projectId:         "elc-worship-dev",
  storageBucket:     "elc-worship-dev.firebasestorage.app",
  messagingSenderId: "PASTE_SANDBOX_SENDER_ID_HERE",
  appId:             "PASTE_SANDBOX_APP_ID_HERE"
};

// ── Auto-detect environment from hostname ─────────────────────────────────────
// Production:  yourname.github.io/worship-scheduler  (or custom domain)
// Sandbox:     yourname.github.io/worship-scheduler-dev  (or localhost)
(function(){
  var host = window.location.hostname;
  var path = window.location.pathname;
  var isSandbox = (host === "localhost" || host === "127.0.0.1")
               || path.indexOf("-dev") !== -1
               || path.indexOf("/dev/") !== -1;

  window.IS_PROD = !isSandbox;
  window.ENV     = isSandbox ? "sandbox" : "production";
  window.FB      = isSandbox ? FB_SANDBOX : FB_PROD;

  // Show environment badge
  var badge = document.getElementById("env-badge");
  if(badge){
    badge.innerHTML = isSandbox
      ? '<span style="background:#f57c00;color:#fff;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:bold;letter-spacing:0.5px">🟡 SANDBOX</span>'
      : '<span style="background:#28a745;color:#fff;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:bold;letter-spacing:0.5px">🟢 PRODUCTION</span>';
  }
})();

// Initialize Firebase immediately (scripts loaded synchronously above)
(function(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB);
    db  = firebase.database();
    ref = db.ref("worship");
    fbReady = true;
    document.getElementById("synctxt").textContent = "✓ Connected";

    db.ref(".info/connected").on("value", function(s){
      document.getElementById("synctxt").textContent = s.val() ? "✓ Connected" : "✗ Offline";
    });

    // Load custom instruments from Firebase (if admin has customized)
    ref.child("settings/instruments").once("value").then(function(snap){
      if(snap.val() && Array.isArray(snap.val()) && snap.val().length > 0){
        INST = snap.val();
      }
      start();
    }).catch(function(){ start(); });

  }catch(e){
    document.getElementById("synctxt").textContent = "✗ Error: " + e.message;
    console.error("Firebase init error:", e);
    start();
  }
})();

function uid(){return sessionStorage.getItem("uid")}
function uname(){return sessionStorage.getItem("name")}
function urole(){return sessionStorage.getItem("role")}
function uinst(){return sessionStorage.getItem("inst")||""}

function isAdmin(){var r=urole();return r==="admin"||r==="co-admin"}

function render(h){document.getElementById("main").innerHTML=h}

function setNav(tabs){
  document.getElementById("mainnav").innerHTML=tabs.map(function(t){
    return '<button class="'+(t[0]===tab?"active":"")+(t[0]==="logout"?" sec":"")+
      '" onclick="goTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join("");
}

function setHeader(){
  if(uname()){
    var r=urole();
    var icon=r==="admin"?"👑":r==="co-admin"?"⭐":"👤";
    var inst=uinst().replace(/\|/g,", ");
    document.getElementById("uinfo").innerHTML=
      '<span style="font-weight:bold">'+icon+' '+uname()+'</span>'+
      ' <span style="color:#aaa;font-size:11px">('+r+')</span>'+
      (inst?'&nbsp;&nbsp;<span style="color:#aaa;font-size:11px">'+inst+'</span>':'');
  }else{
    document.getElementById("uinfo").textContent="";
  }
}

function goTab(t){
  if(t==="logout"){logout();return;}
  tab=t; start();
}

function start(){
  checkRsvpFromUrl();
  setHeader();
  if(!uid()){showLogin();return;}
  if(!uinst()){showInst();return;}
  if(tab==="home") showHome();
  else if(tab==="manage") showManage();
  else if(tab==="plan") showPlan();
  else if(tab==="songs") showSongs();
  else if(tab==="my") showMy();
  else if(tab==="avail") showAvail();
  else if(tab==="chat") showChat();
  else if(tab==="team") showTeam();
  else if(tab==="settings") showSettings();
  else if(tab==="profile") showProfile();
  else if(tab==="log") showLog();
  else showHome();
}

function adminTabs(){return[["home","Home"],["manage","👥 Users"],["songs","Songs"],["chat","Chat"],["settings","⚙️"],["log","📋 Log"],["profile","👤"],["logout","Logout"]]}
function memberTabs(){return[["home","Home"],["songs","Songs"],["avail","Off"],["chat","Chat"],["profile","👤"],["logout","Logout"]]}

function logout(){
  logActivity("logout","Signed out");
  sessionStorage.clear();tab="home";start();
}

/* -- Activity Logger -- */
function logActivity(action, detail){
  if(!fbReady) return;
  var me = sessionStorage.getItem("name")||"Unknown";
  var role = sessionStorage.getItem("role")||"";
  var entry = {
    action:    action,
    detail:    detail||"",
    user:      me,
    role:      role,
    env:       ENV,
    timestamp: new Date().toISOString(),
    ts:        Date.now()
  };
  // Push with auto-id; keep last 500 entries (pruned in showLog)
  ref.child("activityLog").push(entry).catch(function(){});
}

/* ===== LOGIN ===== */
function showLogin(){
  setNav([]);
  render('<div class="card" style="max-width:500px;margin:0 auto" id="logincard"><div class="msg-info">... Checking database...</div></div>');
  
  if(!fbReady){
    document.getElementById("logincard").innerHTML='<h2>🎵 Worship Scheduler</h2><div class="msg-err">... Firebase is loading. Please wait and refresh.</div>';
    return;
  }
  
  ref.child("users").once("value").then(function(snap){
    var users=snap.val()||{};
    var hasAdmin=Object.keys(users).some(function(k){
      return users[k].role==="admin"||users[k].role==="co-admin";
    });
    
    var html='<h2>🎵 Worship Scheduler</h2>';
    
    if(!hasAdmin){
      html+='<div class="msg-ok"><b>👑 Setup: Create Your Admin Account</b><br>You are the first user - you will be Admin.</div>'+
        '<input id="nm" placeholder="Full Name"><input id="em" type="email" placeholder="Email">'+
        '<input id="ph" type="tel" placeholder="Phone"><input id="pw" type="password" placeholder="Password (4+ chars)">'+
        '<button onclick="doSignup(true)" style="background:#28a745">Create Admin Account</button>'+
        '<div id="smsg"></div>';
    }else{
      html+='<div class="msg-info"><b> Join the Team</b><br>Your account needs admin approval before signing in.</div>'+
        '<input id="nm" placeholder="Full Name"><input id="em" type="email" placeholder="Email">'+
        '<input id="ph" type="tel" placeholder="Phone"><input id="pw" type="password" placeholder="Password (4+ chars)">'+
        '<button onclick="doSignup(false)">Request to Join</button>'+
        '<div id="smsg"></div>';
    }
    
    html+='<div style="border-top:1px solid var(--line);margin:20px 0;padding-top:20px">'+
      '<h3 style="margin-top:0">🔑 Sign In</h3>'+
      '<input id="sn" type="email" placeholder="Email"><input id="sp" type="password" placeholder="Password">'+
      '<button class="sec" onclick="doSignin()">Sign In</button>'+
      '<div id="inmsg"></div></div>';
    
    if(!hasAdmin){
      html+='<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:12px">'+
        '<p style="font-size:12px;color:#999;margin:0 0 8px">Stuck? Clear old data:</p>'+
        '<button class="sec" style="color:#c62828;border-color:#c62828" onclick="doReset()">🗑 Clear All & Start Fresh</button>'+
        '<div id="rmsg"></div></div>';
    }
    
    document.getElementById("logincard").innerHTML=html;
  });
}

function doSignup(isFirst){
  var nm=(document.getElementById("nm").value||"").trim();
  var em=(document.getElementById("em").value||"").trim();
  var ph=(document.getElementById("ph").value||"").trim();
  var pw=(document.getElementById("pw").value||"");
  var msg=document.getElementById("smsg");
  
  if(!nm||!em||!ph||pw.length<4){msg.innerHTML='<div class="msg-err">x Fill all fields (password 4+ chars)</div>';return;}
  if(!fbReady){msg.innerHTML='<div class="msg-err">... Firebase not ready</div>';return;}
  
  msg.innerHTML='<div class="msg-info">... Creating account...</div>';

  // Check for duplicate email (case-insensitive)
  ref.child("users").once("value").then(function(snap){
    var users=snap.val()||{};
    var emLower=em.toLowerCase();
    for(var k in users){
      if((users[k].email||"").toLowerCase()===emLower){
        msg.innerHTML='<div class="msg-err">x An account with that email already exists. Please sign in.</div>';
        return;
      }
    }
    createAccount();
  });

  function createAccount(){
  var id="u_"+Math.random().toString(36).substr(2,9);
  ref.child("users/"+id).set({
    name:nm,email:em,phone:ph,pass:pw,
    role:isFirst?"admin":"member",
    status:"approved",  /* all auto-approved; admin manages via manage tab */
    inst:[],off:{},
    createdAt:Date.now()
  },function(err){
    if(err){msg.innerHTML='<div class="msg-err">x '+err.message+'</div>';}
    else{
      if(isFirst){
        msg.innerHTML='<div class="msg-ok">✅ Admin account created! Sign in below.</div>';
        alert("✅ Admin Account Created!\n\nNow sign in below with your email and password.");
      }else{
        msg.innerHTML='<div class="msg-ok">✅ Account created! Sign in below.</div>';
        alert("✅ Account created!\n\nSign in below with your email and password.");
      }
    }
  });
  } // end createAccount
} // end doSignup

function doSignin(){
  var em=(document.getElementById("sn").value||"").trim();
  var pw=(document.getElementById("sp").value||"");
  var msg=document.getElementById("inmsg");

  if(!em||!pw){msg.innerHTML='<div class="msg-err">x Enter email and password</div>';return;}
  if(!fbReady){msg.innerHTML='<div class="msg-err">... Firebase not ready</div>';return;}

  msg.innerHTML='<div class="msg-info">... Signing in...</div>';

  ref.child("users").once("value").then(function(snap){
    var users=snap.val()||{};
    var fk=null,fu=null;

    var emLower=em.toLowerCase();
    for(var k in users){
      if((users[k].email||"").toLowerCase()===emLower){fk=k;fu=users[k];break;}
    }

    if(!fu){msg.innerHTML='<div class="msg-err">x Email not found</div>';return;}
    if(fu.pass!==pw){msg.innerHTML='<div class="msg-err">x Password incorrect</div>';return;}
    if(fu.status==="pending"){msg.innerHTML='<div class="msg-err">... Awaiting admin approval</div>';return;}
    if(fu.status==="rejected"){msg.innerHTML='<div class="msg-err">x Account rejected by admin</div>';return;}
    
    sessionStorage.setItem("uid",fk);
    sessionStorage.setItem("name",fu.name);
    sessionStorage.setItem("role",fu.role);
    sessionStorage.setItem("inst",fu.inst&&fu.inst.length?fu.inst.join("|"):"");
    tab="home";
    start();
    logActivity("login","Signed in as "+fu.role);
  });
}

function doReset(){
  if(!confirm("Delete ALL users and start fresh?")) return;
  ref.child("users").remove(function(err){
    var msg=document.getElementById("rmsg");
    if(err){msg.innerHTML='<div class="msg-err">x '+err.message+'</div>';}
    else{msg.innerHTML='<div class="msg-ok">✅ Cleared! Now create admin above.</div>';showLogin();}
  });
}

/* ===== INSTRUMENTS ===== */
function showInst(){
  setNav([]);
  var sel=uinst().split("|").filter(function(x){return x;});
  var h='<div class="card"><h2>🎸 Select Your Instruments</h2>';
  INST.forEach(function(n){
    h+='<span class="chip'+(sel.indexOf(n)>=0?" on":"")+'" onclick="tglInst(\''+n+'\')">'+n+'</span>';
  });
  h+='<button style="margin-top:20px" onclick="saveInst()">Continue</button></div>';
  render(h);
}
function tglInst(n){
  var sel=uinst().split("|").filter(function(x){return x;});
  var i=sel.indexOf(n);i>=0?sel.splice(i,1):sel.push(n);
  sessionStorage.setItem("inst",sel.join("|"));
  showInst();
}
function saveInst(){
  var sel=uinst().split("|").filter(function(x){return x;});
  if(!sel.length){alert("Pick at least one");return;}
  if(fbReady) ref.child("users/"+uid()).update({inst:sel});
  tab="home";start();
}

/* ===== HOME ===== */
function showHome(){
  if(isAdmin()){
    showPlan(); // Admin home = Plan
  } else {
    showMemberHome(); // Member home = upcoming services + RSVP
  }
}

function showMemberHome(){
  setNav(memberTabs());
  render('<h2>📅 Your Services</h2><div class="card">Loading...</div>');
  if(!fbReady) return;
  var me=uid();

  // Load services, users, songs AND pdf metadata all at once
  Promise.all([
    ref.child("services").once("value"),
    ref.child("users").once("value"),
    ref.child("songs").once("value"),
    ref.child("svcFiles").once("value")   // PDF metadata stored separately
  ]).then(function(results){
    var svcs      = results[0].val()||{};
    var users     = results[1].val()||{};
    var songs     = results[2].val()||{};
    var svcFiles  = results[3].val()||{}; // {sid: {pdfs:{...}, combinedPdf:{name,size,...}}}

    var today = new Date().toISOString().split("T")[0];
    var h='<h2>📅 Your Services</h2>';
    var found=false;
    var keys=Object.keys(svcs).sort(function(a,b){return svcs[a].date>svcs[b].date?1:-1;});

    keys.forEach(function(k){
      var s=svcs[k];
      if(s.date<today) return;
      if(!s.slots) return;
      var myInst=[];
      for(var ins in s.slots){
        if(s.slots[ins]&&s.slots[ins][me]) myInst.push(ins);
      }
      if(!myInst.length) return;
      found=true;

      var rsvpStatus=(s.rsvp&&s.rsvp[me])||"pending";
      var rsvpColor=rsvpStatus==="accepted"?"#28a745":rsvpStatus==="denied"?"#c62828":"#e65100";
      var rsvpLabel=rsvpStatus==="accepted"?"✅ Accepted":rsvpStatus==="denied"?"❌ Declined":"⏳ Respond";
      var svcSongs=s.songs?Object.keys(s.songs).map(function(sk){return{id:sk,title:s.songs[sk],data:songs[sk]};}).filter(function(x){return x.title;}):[];
      var fileData=svcFiles[k]||{};
      var pdfMeta=fileData.pdfs||{};
      var combinedMeta=fileData.combinedPdf||null;

      h+='<div class="card">';

      // Header row
      h+='<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px">'+
        '<div>'+
          '<b style="font-size:16px">'+s.name+'</b><br>'+
          '<small style="color:#999">📅 '+s.date+' &nbsp; ⏰ '+s.time+'</small>'+
        '</div>'+
        '<span style="background:'+rsvpColor+';color:#fff;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;white-space:nowrap">'+rsvpLabel+'</span>'+
        '</div>';

      // Instrument badges
      h+=myInst.map(function(i){return'<span style="background:var(--accent);color:#fff;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:bold;margin-right:4px">'+i+'</span>';}).join('');

      // RSVP buttons
      if(rsvpStatus==="pending"){
        h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px">'+
          '<button onclick="rsvpService(\''+k+'\',\'accepted\')" style="background:#28a745;margin:0;padding:10px">✅ Accept</button>'+
          '<button onclick="rsvpService(\''+k+'\',\'denied\')" style="background:#c23b22;margin:0;padding:10px">❌ Decline</button>'+
          '</div>';
      } else {
        h+='<div style="margin:8px 0">'+
          '<button class="sec" onclick="rsvpService(\''+k+'\','+(rsvpStatus==="accepted"?"'denied'":"'accepted'")+
          ')" style="width:auto;padding:6px 14px;font-size:12px">'+
          (rsvpStatus==="accepted"?"Change to ❌ Decline":"Change to ✅ Accept")+
          '</button></div>';
      }

      // PDFs section — Combined first, then individual
      var hasPdfs = Object.keys(pdfMeta).length > 0;
      if(combinedMeta || hasPdfs){
        h+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">'+
          '<b style="font-size:13px">📄 Service Files</b>';

        if(combinedMeta){
          h+='<button onclick="viewPdf(\''+k+'\',\'combined\')" '+
            'style="display:flex;align-items:center;gap:10px;margin:10px 0 6px;padding:12px 14px;width:100%;'+
            'background:#28a745;color:#fff;border-radius:8px;border:none;cursor:pointer;font-weight:bold;text-align:left">'+
            '<span style="font-size:22px">📦</span>'+
            '<div><div style="font-size:14px">Combined PDF</div>'+
            '<div style="font-size:11px;opacity:0.85">All files merged · '+Math.round((combinedMeta.size||0)/1024)+' KB</div></div>'+
            '</button>';
        }

        if(hasPdfs){
          Object.keys(pdfMeta).forEach(function(pk){
            var pm=pdfMeta[pk];
            h+='<button onclick="viewPdf(\''+k+'\',\''+pk+'\')" '+
              'style="display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;'+
              'background:var(--card);border:1px solid var(--line);border-radius:6px;margin:4px 0;cursor:pointer;text-align:left">'+
              '<span style="font-size:18px">📄</span>'+
              '<div style="flex:1;min-width:0">'+
                '<div style="font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)">'+pm.name+'</div>'+
                '<div style="font-size:11px;color:#999">'+Math.round((pm.size||0)/1024)+' KB</div>'+
              '</div>'+
              '<span style="font-size:12px;color:var(--accent)">Open ›</span>'+
            '</button>';
          });
        }
        h+='</div>';
      }

      // Songs section
      if(svcSongs.length){
        h+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">'+
          '<b style="font-size:13px">🎵 Songs</b>';
        svcSongs.forEach(function(sg){
          h+='<div style="margin-top:8px;padding:10px;background:var(--card);border-radius:6px;border-left:3px solid var(--accent)">'+
            '<b style="font-size:14px">'+sg.title+'</b>';
          if(sg.data){

            if(sg.data.chords) h+='<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--accent);font-size:12px">🎸 Chords</summary><pre style="font-size:11px;white-space:pre-wrap;max-height:160px;overflow:auto;background:var(--bg);padding:8px;border-radius:4px;margin-top:4px">'+sg.data.chords+'</pre></details>';

          }
          h+='</div>';
        });
        h+='</div>';
      }

      // Team list
      var teamByInst={};
      for(var ins in s.slots){
        var pids=Object.keys(s.slots[ins]||{});
        if(pids.length) teamByInst[ins]=pids.map(function(pid){return users[pid]?users[pid].name:"?";});
      }
      var tkeys=Object.keys(teamByInst);
      if(tkeys.length){

          '<b style="font-size:13px">👥 Team</b>';

        });
        h+='</div>';
      }

      h+='</div>'; // end card
    });

    if(!found){
      h='<h2>📅 Your Services</h2><div class="card" style="text-align:center;color:#999;padding:30px">No upcoming services assigned to you</div>';
    }
    render(h);
  });

    render(h);
  });

function deleteSvc(id, name, date){
  if(!confirm('Delete "'+name+'" on '+date+'?\n\nThis will also remove all team assignments and songs for this service.')){
    return;
  }
  ref.child("services/"+id).remove().then(function(){

function addSvc(){
  var d  = document.getElementById("sd").value;
  var tm = document.getElementById("sm").value;
  var nm = document.getElementById("st").value;
  
  if(!d){ alert("Pick a date"); return; }
  
  // Check for duplicate: same date + same time
  ref.child("services").once("value").then(function(snap){
    var svcs = snap.val()||{};
    var duplicate = false;
    var dupName = "";
    
    for(var k in svcs){
      if(svcs[k].date === d && svcs[k].time === tm){
        duplicate = true;
        dupName = svcs[k].name;
        break;
      }
    }
    
    if(duplicate){
      alert("⚠️ A service already exists on " + d + " at " + tm + "\n\n\"" + dupName + "\" is already scheduled at that time.\n\nPlease choose a different date or time.");
      return;
    }
    
    // No duplicate - save
    var id = "s_" + Math.random().toString(36).substr(2,9);
    logActivity("service_created","Created: "+nm+" on "+d);
    ref.child("services/"+id).set({
      name: nm,
      date: d,
      time: tm,
      slots: {},
      songs: {}
    }).then(function(){
      // Clear the form fields
      document.getElementById("sd").value = "";
      showHome();
    });
  });
}

function addAssign(sid,ins,memberId){
  if(!memberId) return;
  // Save assignment + pending RSVP status
  Promise.all([
    ref.child("services/"+sid+"/slots/"+ins+"/"+memberId).set(true),
    ref.child("services/"+sid+"/rsvp/"+memberId).set("pending")
  ]).then(function(){
    logActivity("member_assigned","Assigned to service ("+ins+")");
    // Send email notification to the member
    sendAssignmentEmail(sid, ins, memberId);
    setTimeout(function(){editSvc(sid);},400);
  });
}
function delAssign(sid,ins,memberId){
  logActivity("member_removed","Removed "+ins+" from service "+sid);
  ref.child("services/"+sid+"/slots/"+ins+"/"+memberId).remove();
  ref.child("services/"+sid+"/rsvp/"+memberId).remove().then(function(){editSvc(sid);});
}

// -- Send assignment email to member --
function sendAssignmentEmail(sid, ins, memberId){
  Promise.all([
    ref.child("services/"+sid).once("value"),
    ref.child("users").once("value"),
    ref.child("settings/emailjs").once("value")
  ]).then(function(res){
    var svc    = res[0].val(); if(!svc) return;
    var users  = res[1].val()||{};
    var ejsCfg = res[2].val()||{};

    if(!ejsCfg.publicKey||!ejsCfg.serviceId||!ejsCfg.templateIdMember){
      console.log("EmailJS not configured - skipping email");
      return;
    }

    var member = users[memberId]; if(!member||!member.email) return;

    // Build full team list for email
    var teamLines=[];
    for(var i in (svc.slots||{})){
      for(var uid in svc.slots[i]){
        teamLines.push(i+": "+(users[uid]?users[uid].name:"?"));
      }
    }

    // Find admin email
    var adminEmail="";
    for(var k in users){ if(users[k].role==="admin"){adminEmail=users[k].email;break;} }

    // Build app URL for RSVP links
    var appUrl = window.location.href.split("?")[0];
    var acceptUrl = appUrl+"?rsvp=accept&sid="+sid+"&uid="+memberId;
    var denyUrl   = appUrl+"?rsvp=deny&sid="+sid+"&uid="+memberId;

    initEmailJS(ejsCfg.publicKey);

    emailjs.send(ejsCfg.serviceId, ejsCfg.templateIdMember, {
      to_email:   member.email,
      to_name:    member.name,
      instrument: ins,
      svc_name:   svc.name,
      svc_date:   svc.date,
      svc_time:   svc.time,
      team_list:  teamLines.join("\n"),
      accept_url: acceptUrl,
      deny_url:   denyUrl,
      admin_email:adminEmail
    }).then(function(){
      console.log("✅ Assignment email sent to "+member.name);
    }).catch(function(e){
      console.error("Email error:",e);
    });
  });
}

// -- Handle RSVP links (Accept/Deny from email) --
function checkRsvpFromUrl(){
  var params = new URLSearchParams(window.location.search);
  var rsvp = params.get("rsvp");
  var sid  = params.get("sid");
  var muid = params.get("uid");
  if(!rsvp||!sid||!muid) return;

  // Clean URL
  window.history.replaceState({},document.title,window.location.pathname);

  var status = (rsvp==="accept") ? "accepted" : "denied";

  Promise.all([
    ref.child("services/"+sid).once("value"),
    ref.child("users").once("value"),
    ref.child("settings/emailjs").once("value")
  ]).then(function(res){
    var svc    = res[0].val(); if(!svc) return;
    var users  = res[1].val()||{};
    var ejsCfg = res[2].val()||{};
    var member = users[muid];   if(!member) return;

    // Save RSVP status to Firebase
    ref.child("services/"+sid+"/rsvp/"+muid).set(status).then(function(){
      // Show confirmation in app
      var msg = status==="accepted"
        ? "✅ You've ACCEPTED the service!\n\n"+svc.name+"\n"+svc.date+" at "+svc.time
        : "x You've DECLINED the service.\n\n"+svc.name+"\n"+svc.date+" at "+svc.time+"\n\nAdmin has been notified.";
      alert(msg);

      // Send RSVP summary email to admin
      if(ejsCfg.publicKey&&ejsCfg.serviceId&&ejsCfg.templateIdAdmin){
        var adminEmail="";
        for(var k in users){ if(users[k].role==="admin"){adminEmail=users[k].email;break;} }
        if(!adminEmail) return;

        // Build full RSVP status list
        var rsvpData = svc.rsvp||{};
        rsvpData[muid] = status; // include current response
        var accepted=[], denied=[], pending=[];
        for(var ins in (svc.slots||{})){
          for(var uid in svc.slots[ins]){
            var u=users[uid]; if(!u) continue;
            var st=rsvpData[uid]||"pending";
            var line=u.name+" ("+ins+")";
            if(st==="accepted") accepted.push(line);
            else if(st==="denied") denied.push(line);
            else pending.push(line);
          }
        }

        initEmailJS(ejsCfg.publicKey);
        emailjs.send(ejsCfg.serviceId, ejsCfg.templateIdAdmin, {
          to_email:      adminEmail,
          member_name:   member.name,
          rsvp_status:   status.toUpperCase(),
          svc_name:      svc.name,
          svc_date:      svc.date,
          svc_time:      svc.time,
          accepted_list: accepted.length ? accepted.join("\n") : "None yet",
          denied_list:   denied.length   ? denied.join("\n")   : "None",
          pending_list:  pending.length  ? pending.join("\n")  : "None"
        }).catch(function(e){ console.error("Admin email error:",e); });
      }
    });
  });
}

function addInstField(){
  var val=(document.getElementById("new-inst").value||"").trim();
  if(!val) return;
  window._currentInst = getCurrentInstList();
  if(window._currentInst.indexOf(val)>=0){
    alert("\""+val+"\" already exists"); return;
  }
  window._currentInst.push(val);
  document.getElementById("new-inst").value="";
  rebuildInstList();
}

function removeInst(i){
  window._currentInst = getCurrentInstList();
  var name = window._currentInst[i];
  if(!confirm('Remove "'+name+'"?\n\nNote: members already assigned this role keep it in their profile until they update it.')) return;
  window._currentInst.splice(i,1);
  rebuildInstList();
}

function getCurrentInstList(){
  var list=[];
  var rows=document.querySelectorAll("#inst-list input");
  rows.forEach(function(el){ var v=(el.value||"").trim(); if(v) list.push(v); });
  return list;
}

function rebuildInstList(){
  var inst=window._currentInst;
  var html="";
  inst.forEach(function(name,i){
    html+='<div style="display:flex;align-items:center;gap:8px;margin:6px 0">'+
      '<input value="'+name+'" id="inst-'+i+'" style="flex:1;margin:0">'+
      '<button onclick="removeInst('+i+')" style="width:36px;height:36px;padding:0;margin:0;background:#ffebee;color:#c62828;border:1px solid #ef9a9a;border-radius:6px;flex-shrink:0">✕</button>'+
      '</div>';
  });
  document.getElementById("inst-list").innerHTML=html;
}

function saveInstruments(){
  var list=getCurrentInstList();
  if(!list.length){ alert("Add at least one instrument"); return; }
  var msg=document.getElementById("inst-msg");
  msg.innerHTML='<div class="msg-info">... Saving...</div>';
  ref.child("settings/instruments").set(list).then(function(){
    INST=list; // update live in this session
    msg.innerHTML='<div class="msg-ok">✅ Saved! Members will see updated list on next login.</div>';
  }).catch(function(e){
    msg.innerHTML='<div class="msg-err">x '+e.message+'</div>';
  });
}


function saveEmailSettings(){
  var pub = (document.getElementById("ejs-pub").value||"").trim();
  var svc = (document.getElementById("ejs-svc").value||"").trim();
  var tm  = (document.getElementById("ejs-tm").value||"").trim();
  var ta  = (document.getElementById("ejs-ta").value||"").trim();
  var url = (document.getElementById("ejs-url").value||"").trim();
  var msg = document.getElementById("settings-msg");

  if(!pub||!svc||!tm||!ta){
    msg.innerHTML='<div class="msg-err">x Fill Public Key, Service ID and both Template IDs</div>'; return;
  }
  msg.innerHTML='<div class="msg-info">... Saving...</div>';

  ref.child("settings/emailjs").set({
    publicKey:pub, serviceId:svc,
    templateIdMember:tm, templateIdAdmin:ta,
    appUrl:url
  }).then(function(){
    initEmailJS(pub);
    msg.innerHTML='<div class="msg-ok">✅ Email settings saved!</div>';
  }).catch(function(e){
    msg.innerHTML='<div class="msg-err">x '+e.message+'</div>';
  });
}

function tglRDay(d){
  window._reminderDays = window._reminderDays||["monday","friday"];
  var i = window._reminderDays.indexOf(d);
  if(i>=0) window._reminderDays.splice(i,1);
  else window._reminderDays.push(d);
  // Update chip appearance
  var chip = document.getElementById("rday-"+d);
  if(chip) chip.className = "chip"+(window._reminderDays.indexOf(d)>=0?" on":"");
}

function saveReminderSchedule(){
  var days = window._reminderDays||[];
  var hourEl = document.getElementById("r-hour");
  var hour   = hourEl ? parseInt(hourEl.value,10) : 8;
  var msg    = document.getElementById("remind-msg");

  if(!days.length){
    msg.innerHTML='<div class="msg-err">x Select at least one day</div>'; return;
  }
  msg.innerHTML='<div class="msg-info">... Saving...</div>';

  ref.child("settings/reminder").set({
    days:    days,
    hourPST: hour,
    minutePST: 0
  }).then(function(){
    var dayLabels = days.map(function(d){return d.charAt(0).toUpperCase()+d.slice(1);}).join(", ");
    var h12  = hour>12?hour-12:(hour||12);
    var ampm = hour>=12?"PM":"AM";
    msg.innerHTML='<div class="msg-ok">✅ Reminders set for <b>'+dayLabels+'</b> at <b>'+h12+':00 '+ampm+' PST</b></div>';
  }).catch(function(e){
    msg.innerHTML='<div class="msg-err">x '+e.message+'</div>';
  });
}

function addSvcSong(sid,songId,title){
  if(!songId) return;
  ref.child("services/"+sid+"/songs/"+songId).set(title.split(' (')[0]).then(function(){editSvcSongs(sid);});
}
function removeSvcSong(sid,songId){
  ref.child("services/"+sid+"/songs/"+songId).remove().then(function(){editSvcSongs(sid);});
}

// ── Open a PDF stored in Firebase ──
function viewPdf(sid, pdfId){
  // Show loading indicator on the button that was clicked
  var btn = event && event.target;
  var origText = btn ? btn.textContent : "";
  if(btn) btn.textContent = "⏳ Loading...";

  ref.child("svcPdfData/"+sid+"/"+pdfId).once("value").then(function(snap){
    if(btn) btn.textContent = origText;

    var dataUrl = snap.val();
    if(!dataUrl){
      alert("PDF not found. It may have been removed.");
      return;
    }

    try{
      // Convert base64 data URL → Blob → Blob URL (no popup blocker issues)
      var base64 = dataUrl.split(",")[1];
      if(!base64){ alert("Invalid PDF data."); return; }

      var binary  = atob(base64);
      var bytes   = new Uint8Array(binary.length);
      for(var i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);

      var blob    = new Blob([bytes], {type:"application/pdf"});
      var blobUrl = URL.createObjectURL(blob);

      // Try opening in new tab
      var opened = window.open(blobUrl, "_blank");

      if(!opened){
        // Popup blocked — trigger download instead
        var a = document.createElement("a");
        a.href = blobUrl;
        a.download = (pdfId === "combined" ? "Combined-Service.pdf" : "Service.pdf");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        // Small delay then revoke blob
        setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 5000);
      } else {
        // Revoke after tab has loaded
        setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 10000);
      }
    }catch(e){
      if(btn) btn.textContent = origText;
      alert("Error opening PDF: "+e.message);
    }
  }).catch(function(e){
    if(btn) btn.textContent = origText;
    alert("Error loading PDF: "+e.message);
  });
}

// ── Upload multiple PDFs ──
// PDFs stored under: svcFiles/{sid}/pdfs/{id}  (metadata only — name, size, url)
// Actual binary stored under: svcPdfData/{sid}/{id}  (large base64 kept separate)
function uploadSvcPdfs(sid){
  var input = document.getElementById("svc-pdf-upload");
  var files = Array.from(input.files);
  if(!files.length) return;
  var status = document.getElementById("pdf-upload-status");
  status.innerHTML='<span style="color:#e65100">⏳ Uploading '+files.length+' file(s)... please wait</span>';

  var done=0;
  var errors=[];

  files.forEach(function(file){
    if(file.size > 8*1024*1024){
      errors.push(file.name+" too large (max 8MB)");
      done++;
      checkDone();
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      var id = "pdf_"+Math.random().toString(36).substr(2,9);
      var dataUrl = e.target.result;
      // Store binary data in separate path to keep services node small
      ref.child("svcPdfData/"+sid+"/"+id).set(dataUrl, function(err){
        if(err){
          errors.push(file.name+": "+err.message);
        } else {
          // Store only metadata in the svcFiles path
          ref.child("svcFiles/"+sid+"/pdfs/"+id).set({
            name: file.name,
            size: file.size,
            url:  "#pdf:"+sid+":"+id,  // internal reference
            uploadedAt: Date.now()
          });
        }
        done++;
        checkDone();
      });
    };
    reader.onerror = function(){
      errors.push("Failed to read "+file.name);
      done++;
      checkDone();
    };
    reader.readAsDataURL(file);
  });

  function checkDone(){
    if(done < files.length) return;
    if(errors.length){
      status.innerHTML='<span style="color:#c62828">❌ Errors: '+errors.join(", ")+'</span>';
    } else {
      status.innerHTML='<span style="color:#28a745">✅ '+files.length+' file(s) uploaded</span>';
    }
    // Clear combined PDF since files changed
    ref.child("svcFiles/"+sid+"/combinedPdf").remove();
    ref.child("svcPdfData/"+sid+"/combined").remove();
    setTimeout(function(){ editSvcSongs(sid); }, 800);
  }
}

function removeSvcPdf(sid, pdfId){
  if(!confirm("Remove this PDF?")) return;
  Promise.all([
    ref.child("svcFiles/"+sid+"/pdfs/"+pdfId).remove(),
    ref.child("svcPdfData/"+sid+"/"+pdfId).remove(),
    ref.child("svcFiles/"+sid+"/combinedPdf").remove(),
    ref.child("svcPdfData/"+sid+"/combined").remove()
  ]).then(function(){ editSvcSongs(sid); });
}

// ── Load PDF data from separate storage path ──
async function loadPdfData(sid, pdfId){
  var snap = await ref.child("svcPdfData/"+sid+"/"+pdfId).once("value");
  return snap.val();
}

// ── Combine all service PDFs into one using pdf-lib ──
async function combineSvcPdfs(sid){
  var statusEl = document.getElementById("combine-status");
  statusEl.innerHTML='<span style="color:#e65100">⏳ Loading PDF files...</span>';

  try {
    if(typeof PDFLib === "undefined"){
      statusEl.innerHTML='<span style="color:#c62828">❌ PDF library not loaded. Check internet connection.</span>';
      return;
    }

    // Load metadata
    var metaSnap = await ref.child("svcFiles/"+sid+"/pdfs").once("value");
    var pdfMeta  = metaSnap.val();
    if(!pdfMeta || !Object.keys(pdfMeta).length){
      statusEl.innerHTML='<span style="color:#c62828">❌ No PDFs to combine. Upload files first.</span>';
      return;
    }

    var pdfKeys = Object.keys(pdfMeta).sort(function(a,b){
      return (pdfMeta[a].uploadedAt||0)-(pdfMeta[b].uploadedAt||0);
    });

    statusEl.innerHTML='<span style="color:#e65100">⏳ Merging '+pdfKeys.length+' PDFs...</span>';
    var mergedPdf = await PDFLib.PDFDocument.create();
    var totalPages=0;

    for(var i=0; i<pdfKeys.length; i++){
      var pk   = pdfKeys[i];
      var meta = pdfMeta[pk];
      statusEl.innerHTML='<span style="color:#e65100">⏳ Processing: '+meta.name+' ('+(i+1)+'/'+pdfKeys.length+')</span>';

      // Load binary data from separate path
      var dataUrl = await loadPdfData(sid, pk);
      if(!dataUrl){ console.warn("No data for "+pk); continue; }

      var base64 = dataUrl.split(',')[1];
      var binary  = atob(base64);
      var bytes   = new Uint8Array(binary.length);
      for(var j=0; j<binary.length; j++) bytes[j]=binary.charCodeAt(j);

      try{
        var srcDoc = await PDFLib.PDFDocument.load(bytes.buffer);
        var pages  = await mergedPdf.copyPages(srcDoc, srcDoc.getPageIndices());
        pages.forEach(function(p){ mergedPdf.addPage(p); totalPages++; });
      }catch(e2){
        console.warn("Skipping "+meta.name+": "+e2.message);
      }
    }

    if(totalPages===0){
      statusEl.innerHTML='<span style="color:#c62828">❌ Could not read any PDF pages. Check files are valid PDFs.</span>';
      return;
    }

    statusEl.innerHTML='<span style="color:#e65100">⏳ Saving combined PDF ('+totalPages+' pages)...</span>';
    var mergedBytes  = await mergedPdf.save();
    var mergedArr    = new Uint8Array(mergedBytes);
    var mergedBin    = '';
    for(var k2=0; k2<mergedArr.length; k2++) mergedBin+=String.fromCharCode(mergedArr[k2]);
    var mergedB64    = 'data:application/pdf;base64,'+btoa(mergedBin);

    // Store combined binary data separately
    await ref.child("svcPdfData/"+sid+"/combined").set(mergedB64);
    // Store metadata in svcFiles
    await ref.child("svcFiles/"+sid+"/combinedPdf").set({
      name:  "Combined-"+sid+".pdf",
      size:  mergedArr.length,
      pages: totalPages,
      url:   "#pdf:"+sid+":combined",
      createdAt: Date.now()
    });

    statusEl.innerHTML='<span style="color:#28a745">✅ Combined PDF ready ('+totalPages+' pages)! Team members can now view it.</span>';
    setTimeout(function(){ editSvcSongs(sid); }, 1200);

  }catch(e){
    console.error("Combine error:", e);
    statusEl.innerHTML='<span style="color:#c62828">❌ Error: '+e.message+'</span>';
  }
}

// -- Key transposition --
var CHROMATIC = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var CHORD_NAMES = {
  "C":0,"C#":1,"Db":1,"D":2,"D#":3,"Eb":3,"E":4,"F":5,
  "F#":6,"Gb":6,"G":7,"G#":8,"Ab":8,"A":9,"A#":10,"Bb":10,"B":11
};
var NUM_TO_SEMITONE = [0,2,4,5,7,9,11]; // scale degrees 1-7

function semitoneOf(key){
  return CHORD_NAMES[key]!==undefined ? CHORD_NAMES[key] : 0;
}

function transposeChord(chord, semitones){
  // Handles: G, Am, F#m, Bb, Cmaj7, D/F#, etc.
  return chord.replace(/[A-G][b#]?/g, function(note, offset){
    // Only transpose the first note or bass note
    var s = CHORD_NAMES[note];
    if(s===undefined) return note;
    var newS = ((s + semitones) % 12 + 12) % 12;
    return CHROMATIC[newS];
  });
}

function transposeText(text, fromKey, toKey){
  if(!text||fromKey===toKey) return text;
  var semitones = ((semitoneOf(toKey) - semitoneOf(fromKey)) % 12 + 12) % 12;
  // Match chord tokens: word-boundary chord names followed by optional suffix
  return text.replace(/\b([A-G][b#]?)(m|maj|min|dim|aug|sus|add|2|4|5|6|7|9|11|13|maj7|m7|dim7|m7b5|\/[A-G][b#]?)*/g, function(match){
    return transposeChord(match, semitones);
  });
}

function buildNumberChart(chordText, key){
  if(!chordText) return "";
  var rootSemitone = semitoneOf(key);
  var scale = NUM_TO_SEMITONE.map(function(s){ return (rootSemitone+s)%12; });

  return chordText.replace(/\b([A-G][b#]?)(m|maj|min|dim|aug|sus|add|2|4|5|6|7|9|11|13|maj7|m7|dim7|m7b5|\/[A-G][b#]?)*/g, function(match, root, suffix){
    var s = CHORD_NAMES[root];
    if(s===undefined) return match;
    var degree = scale.indexOf(s);
    if(degree===-1) return match; // chromatic - leave as chord name
    var num = degree+1;
    var isMinor = suffix&&(suffix[0]==="m"||suffix.indexOf("min")===0);
    return num+(isMinor?"m":"")+(suffix&&!isMinor?suffix:"");
  });
}

function transposePreview(){
  var key    = (document.getElementById("sk")||{}).value;
  var chords = (document.getElementById("schords")||{}).value||"";
  if(!key||!chords) return;

  // Store original key when user first types chords
  if(!window._originalKey){
    window._originalKey = key;
    window._originalChords = chords;
  }

  // Regenerate number chart from current chords + key
  var nc = buildNumberChart(chords, key);
  var ncEl = document.getElementById("snc");
  if(ncEl && nc) ncEl.value = nc;
}

function transposeForm(fromKey, toKey){
  // Transpose chords text to new key and regenerate number chart
  var chordsEl = document.getElementById("schords");
  if(!chordsEl) return;
  var chords = chordsEl.value;
  if(!chords||!fromKey||!toKey||fromKey===toKey) return;

  var newChords = transposeText(chords, fromKey, toKey);
  chordsEl.value = newChords;

  var nc = buildNumberChart(newChords, toKey);
  var ncEl = document.getElementById("snc");
  if(ncEl) ncEl.value = nc;
}

  if(window._lastFormKey && window._lastFormKey !== newKey){
    transposeForm(window._lastFormKey, newKey);
  }
  window._lastFormKey = newKey;
  transposePreview();
}

function applyTranspose(songId, fromKey){
  var newKey = document.getElementById("new-key").value;
  if(!fbReady) return;

  var sg = window._editSongData;
  if(!sg) return;

  var newChords = sg.chords ? transposeText(sg.chords, fromKey, newKey) : sg.chords;
  var newNC     = newChords ? buildNumberChart(newChords, newKey) : sg.numberChart;

  ref.child("songs/"+songId).update({
    key:         newKey,
    chords:      newChords||"",
    numberChart: newNC||""
  }).then(function(){
    alert("✅ Transposed to "+newKey+" and saved!");
    showSongs();
  });
}

  };

  // Attach uploaded files if any

function rsvpService(sid, status){
  var me=uid();
  logActivity("rsvp_response","RSVP "+status+" for service "+sid);
  ref.child("services/"+sid+"/rsvp/"+me).set(status).then(function(){
    // Send RSVP notification to admin
    Promise.all([
      ref.child("services/"+sid).once("value"),
      ref.child("users").once("value"),
      ref.child("settings/emailjs").once("value")
    ]).then(function(res){
      var svc    = res[0].val()||{};
      var users  = res[1].val()||{};
      var ejsCfg = res[2].val()||{};
      var member = users[me];

      if(ejsCfg.publicKey&&ejsCfg.serviceId&&ejsCfg.templateIdAdmin&&member){
        var adminEmail="";
        for(var k in users){ if(users[k].role==="admin"){adminEmail=users[k].email;break;} }

        if(adminEmail){
          var rsvpData=svc.rsvp||{};
          rsvpData[me]=status;
          var accepted=[],denied=[],pending=[];
          for(var ins in (svc.slots||{})){
            for(var uid in svc.slots[ins]){
              var u=users[uid]; if(!u) continue;
              var st=rsvpData[uid]||"pending";
              var line=u.name+" ("+ins+")";
              if(st==="accepted") accepted.push(line);
              else if(st==="denied") denied.push(line);
              else pending.push(line);
            }
          }
          initEmailJS(ejsCfg.publicKey);
          emailjs.send(ejsCfg.serviceId, ejsCfg.templateIdAdmin,{
            to_email:     adminEmail,
            member_name:  member.name,
            rsvp_status:  status.toUpperCase(),
            svc_name:     svc.name,
            svc_date:     svc.date,
            svc_time:     svc.time,
            accepted_list:accepted.length?accepted.join("\n"):"None yet",
            denied_list:  denied.length?denied.join("\n"):"None",
            pending_list: pending.length?pending.join("\n"):"None"
          }).catch(function(e){console.error("RSVP email error:",e);});
        }
      }
    });
    showMy();
  });
}

function renderCal(){
  var today=new Date(), year=today.getFullYear();
  var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var h='<h2>Off Days</h2><p style="color:#999;font-size:12px">Tap dates to mark unavailable</p>';
  
  for(var yr=year;yr<=year+1;yr++){
    h+='<h3 style="text-align:center">'+yr+'</h3>';
    for(var m=0;m<12;m++){
      var dim=new Date(yr,m+1,0).getDate(), fd=new Date(yr,m,1).getDay();
      h+='<div style="margin-bottom:16px"><div style="font-weight:bold;font-size:13px;margin-bottom:4px">'+MN[m]+'</div>'+
        '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
      ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){
        h+='<div style="text-align:center;font-size:10px;font-weight:bold;color:#999">'+d+'</div>';
      });
      for(var e=0;e<fd;e++) h+='<div></div>';
      for(var day=1;day<=dim;day++){
        var ds=yr+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        var isSel=!!selDays[ds];
        var isToday=(yr===today.getFullYear()&&m===today.getMonth()&&day===today.getDate());
        var style='cursor:pointer;padding:4px;text-align:center;border-radius:4px;border:'+
          (isToday?'2px solid var(--accent)':'1px solid var(--line)')+
          ';background:'+(isSel?'var(--accent)':'var(--bg)')+
          ';color:'+(isSel?'#fff':'var(--ink)');
        h+='<div style="'+style+'" onclick="tglDay(\''+ds+'\')">'+day+'</div>';
      }
      h+='</div></div>';
    }
  }
  h+='<button onclick="saveOff()">Save Off Days</button>'+
    '<button class="sec" onclick="clearOff()" style="margin-top:4px">Clear All</button>';
  render(h);
}
function tglDay(ds){selDays[ds]?delete selDays[ds]:(selDays[ds]=true);renderCal();}

// ── Enter key sends message ──
function onChatKey(e){
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMsg();
  }
}

// ── @mention autocomplete ──
function onChatInput(input){
  var val = input.value;
  var atIdx = val.lastIndexOf("@");
  var suggest = document.getElementById("mention-suggest");
  if(!suggest) return;

  if(atIdx === -1){
    suggest.style.display = "none";
    return;
  }

  var partial = val.slice(atIdx+1).toLowerCase();
  if(partial.includes(" ")){
    suggest.style.display = "none";
    return;
  }

  // Load users for suggestions
  ref.child("users").once("value").then(function(snap){
    var users = snap.val()||{};
    var matches = [];
    for(var k in users){
      var u = users[k];
      if(u.status==="approved" && u.name !== uname()){
        if(!partial || u.name.toLowerCase().startsWith(partial)){
          matches.push(u.name);
        }
      }
    }

    if(!matches.length){
      suggest.style.display = "none";
      return;
    }

    suggest.style.display = "block";
    suggest.innerHTML = matches.slice(0,5).map(function(name){
      return '<div onclick="insertMention(\''+name+'\')" '+
        'style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)" '+
        'onmouseover="this.style.background=\'var(--bg)\'" '+
        'onmouseout="this.style.background=\'\'">'+
        '👤 '+name+'</div>';
    }).join("");
  });
}

function insertMention(name){
  var input = document.getElementById("cmsg");
  var val = input.value;
  var atIdx = val.lastIndexOf("@");
  input.value = val.slice(0, atIdx) + "@"+name+" ";
  input.focus();
  var suggest = document.getElementById("mention-suggest");
  if(suggest) suggest.style.display = "none";
}

function sendMsg(){
  var el = document.getElementById("cmsg");
  var tx = (el.value||"").trim();
  if(!tx || !fbReady) return;

  // Parse @mentions from the message
  var mentions = [];
  var mentionRe = /@([\w ]+?)(?=\s|$|@)/g;
  var m;
  while((m = mentionRe.exec(tx)) !== null){
    mentions.push(m[1].trim());
  }

  // Save message
  var msgData = { name:uname(), text:tx, time:Date.now() };
  if(mentions.length) msgData.mentions = mentions;

  ref.child("messages").push(msgData).then(function(){
    el.value = "";
    var suggest = document.getElementById("mention-suggest");
    if(suggest) suggest.style.display = "none";

    // Send notifications to mentioned users
    if(mentions.length && fbReady){
      ref.child("users").once("value").then(function(snap){
        var users = snap.val()||{};
        for(var k in users){
          var u = users[k];
          if(u.status !== "approved") continue;
          // Check if this user was mentioned
          var wasMentioned = mentions.some(function(mn){
            return u.name.toLowerCase() === mn.toLowerCase();
          });
          if(wasMentioned && u.name !== uname()){
            var notifId = "notif_"+Math.random().toString(36).substr(2,9);
            ref.child("users/"+k+"/notifications/"+notifId).set({
              type:      "mention",
              message:   uname()+" mentioned you in chat: \""+tx.slice(0,80)+(tx.length>80?"...":"")+"\"",
              timestamp: new Date().toISOString(),
              read:      false
            });
          }
        }
      });
    }
  });
}

  var email  = (document.getElementById("p-email").value||"").trim();
  var phone  = (document.getElementById("p-phone").value||"").trim();
  var curpw  = (document.getElementById("p-curpw").value||"");
  var newpw  = (document.getElementById("p-newpw").value||"");
  var confpw = (document.getElementById("p-confpw").value||"");
  var msg    = document.getElementById("profile-msg");

  if(!name||!email||!phone){
    msg.innerHTML='<div class="msg-err">x Name, email and phone are required</div>'; return;
  }
  if(!curpw){
    msg.innerHTML='<div class="msg-err">x Enter your current password to save changes</div>'; return;
  }
  if(newpw&&newpw.length<4){
    msg.innerHTML='<div class="msg-err">x New password must be 4+ characters</div>'; return;
  }
  if(newpw&&newpw!==confpw){
    msg.innerHTML='<div class="msg-err">x New passwords do not match</div>'; return;
  }

  msg.innerHTML='<div class="msg-info">... Verifying...</div>';

  ref.child("users/"+uid()+"/pass").once("value").then(function(snap){
    if(snap.val()!==curpw){
      msg.innerHTML='<div class="msg-err">x Current password is incorrect</div>'; return;
    }
    var updates = { name:name, email:email, phone:phone };
    if(newpw) updates.pass = newpw;
    ref.child("users/"+uid()).update(updates).then(function(){
      logActivity("profile_updated","Updated profile");
      sessionStorage.setItem("name", name);
      setHeader();
      msg.innerHTML='<div class="msg-ok">✅ Profile updated successfully!</div>';
    }).catch(function(e){
      msg.innerHTML='<div class="msg-err">x '+e.message+'</div>';
    });
  });
}

function deleteOwnAccount(){
  if(!confirm("Delete your account permanently?\n\nThis cannot be undone.")) return;
  var curpw = prompt("Enter your password to confirm:");
  if(!curpw) return;
  ref.child("users/"+uid()+"/pass").once("value").then(function(snap){
    if(snap.val()!==curpw){ alert("x Password incorrect."); return; }
    ref.child("users/"+uid()).remove().then(function(){
      alert("Your account has been deleted.");
      logout();
    });
  });
}



/* ===== ACTIVITY LOG (Admin) ===== */
function showLog(){
  setNav(adminTabs());
  render('<h2>📋 Activity Log</h2><div class="card">Loading...</div>');
  if(!fbReady) return;

  ref.child("activityLog").orderByChild("ts").limitToLast(200).once("value").then(function(snap){
    var entries=[];
    if(snap.val()){
      for(var k in snap.val()) entries.push({id:k,...snap.val()[k]});
    }
    // Sort newest first
    entries.sort(function(a,b){return (b.ts||0)-(a.ts||0);});

    var ACTION_ICONS={
      login:"🔑", logout:"🚪",
      user_approved:"✅", user_rejected:"❌",
      promoted_coadmin:"*", demoted_coadmin:"⬇",
      service_created:"📅", service_deleted:"🗑",
      member_assigned:"👥", member_removed:"✂️",
      rsvp_response:"📬",
      song_added:"🎵", song_deleted:"🗑",
      profile_updated:""
    };

    var ACTION_LABELS={
      login:"Sign In", logout:"Sign Out",
      user_approved:"User Approved", user_rejected:"User Rejected",
      promoted_coadmin:"Made Co-Admin", demoted_coadmin:"Removed Co-Admin",
      service_created:"Service Created", service_deleted:"Service Deleted",
      member_assigned:"Member Assigned", member_removed:"Member Removed",
      rsvp_response:"RSVP Response",
      song_added:"Song Added", song_deleted:"Song Deleted",
      profile_updated:"Profile Updated"
    };

    // Filter controls
    var h='<h2>📋 Activity Log</h2>';
    h+='<div class="card" style="padding:10px">';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center">';
    h+='<input id="log-search" placeholder="Search user or action..." oninput="filterLog()" style="margin:0">';
    h+='<select id="log-filter" onchange="filterLog()" style="margin:0">'+
      '<option value="">All Actions</option>'+
      Object.keys(ACTION_LABELS).map(function(k){return'<option value="'+k+'">'+ACTION_LABELS[k]+'</option>';}).join("")+
    '</select>';
    h+='<button onclick="clearLog()" style="width:auto;padding:8px 12px;margin:0;background:#ffebee;color:#c62828;border:1px solid #ef9a9a;font-size:12px">🗑 Clear</button>';
    h+='</div>';
    h+='<div style="font-size:12px;color:#999;margin-top:8px">'+entries.length+' entries (newest first)</div>';
    h+='</div>';

    if(!entries.length){
      h+='<div class="card" style="text-align:center;color:#999;padding:30px">No activity yet. Actions will appear here as users interact with the app.</div>';
      render(h);
      return;
    }

    h+='<div id="log-entries">';

    // Group by date
    var lastDate="";
    entries.forEach(function(e){
      var dt  = new Date(e.timestamp||Date.now());
      var dateStr = dt.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
      var timeStr = dt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
      var icon  = ACTION_ICONS[e.action]  || "•";
      var label = ACTION_LABELS[e.action] || e.action;
      var roleColor = e.role==="admin"?"#7b5e3b":e.role==="co-admin"?"#9c7c3a":"#666";
      var envBadge = e.env==="production"
        ? '<span style="font-size:9px;background:#28a745;color:#fff;padding:1px 5px;border-radius:8px;margin-left:4px">PROD</span>'
        : '<span style="font-size:9px;background:#ff9800;color:#fff;padding:1px 5px;border-radius:8px;margin-left:4px">SBX</span>';

      if(dateStr!==lastDate){
        h+='<div style="margin:16px 0 6px;font-size:12px;font-weight:bold;color:#999;text-transform:uppercase;letter-spacing:0.5px">'+dateStr+'</div>';
        lastDate=dateStr;
      }

      h+='<div class="log-entry" data-action="'+e.action+'" data-user="'+(e.user||"").toLowerCase()+'" '+
        'style="display:flex;align-items:start;gap:10px;padding:8px 10px;background:var(--bg);border-radius:6px;margin:3px 0;font-size:13px">'+
        '<span style="font-size:18px;flex-shrink:0;margin-top:1px">'+icon+'</span>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px">'+
            '<b>'+label+'</b>'+
            '<span style="font-size:11px;color:#999;white-space:nowrap">'+timeStr+'</span>'+
          '</div>'+
          (e.detail?'<div style="color:#666;margin-top:2px;font-size:12px">'+escHtml(e.detail)+'</div>':'')+
          '<div style="margin-top:4px">'+
            '<span style="font-size:11px;color:'+roleColor+'">'+e.user+'</span>'+
            envBadge+
          '</div>'+
        '</div>'+
      '</div>';
    });

    h+='</div>';
    render(h);
  });
}

function filterLog(){
  var search  = (document.getElementById("log-search").value||"").toLowerCase();
  var filter  = document.getElementById("log-filter").value;
  var entries = document.querySelectorAll(".log-entry");
  entries.forEach(function(el){
    var action = el.getAttribute("data-action")||"";
    var user   = el.getAttribute("data-user")||"";
    var text   = el.textContent.toLowerCase();
    var show   = (!filter || filter===action) && (!search || text.indexOf(search)>=0);
    el.style.display = show ? "" : "none";
  });
}

function clearLog(){
  if(!confirm("Clear all activity log entries?\n\nThis cannot be undone.")) return;
  ref.child("activityLog").remove().then(function(){
    showLog();
  });
}

function escHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}


start();
</script>
</body>
</html>
