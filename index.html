<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worship Scheduler</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22201c;--accent:#7b5e3b;--line:#e3ded4}
@media(prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#252220;--ink:#f0ece5;--accent:#c9a877;--line:#3a3532}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
header{background:var(--card);padding:12px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px}h2{margin:10px 0;font-size:16px}h3{margin:12px 0 8px;font-size:14px}
main{max-width:800px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);padding:14px;margin:12px 0;border-radius:8px}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:6px;font-size:14px}
button{background:var(--accent);color:#fff;border:0;padding:10px;border-radius:6px;cursor:pointer;margin:4px 0;width:100%}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
label{display:block;margin:10px 0 2px;font-weight:600;font-size:12px;color:#999}
.chip{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:20px;margin:4px;cursor:pointer;background:var(--bg);font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav{padding:8px;display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{margin:0;padding:8px 12px;width:auto;font-size:13px}
.status{font-size:11px;color:#999;margin-top:4px}
.song{background:var(--bg);padding:10px;margin:8px 0;border-radius:6px}
.msg{background:var(--bg);padding:8px;margin:6px 0;border-radius:4px;font-size:12px}
.pending{background:#fff3cd;padding:12px;border-radius:6px;margin:8px 0;border-left:4px solid #ff9800}
.approved{background:#d4edda;padding:12px;border-radius:6px;margin:8px 0;border-left:4px solid #28a745}
.green{background:#28a745}.red{background:#c23b22}
.msg-ok{background:#e8f5e9;color:#2e7d32;padding:10px;border-radius:6px;margin:8px 0;border-left:4px solid #28a745}
.msg-err{background:#ffebee;color:#c62828;padding:10px;border-radius:6px;margin:8px 0;border-left:4px solid #c62828}
.msg-info{background:#fff3e0;color:#e65100;padding:10px;border-radius:6px;margin:8px 0;border-left:4px solid #ff9800}
</style>
</head>
<body>
<header>
  <h1>🎵 Worship Scheduler</h1>
  <div id="uinfo" style="font-size:12px;color:#999;margin-top:4px"></div>
  <div class="status" id="synctxt">⏳ Starting...</div>
</header>
<nav id="mainnav"></nav>
<main id="main"></main>

<script async defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script async defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var db, ref;
var fbReady = false;
var tab = "home";
var selDays = {};
var INST = ["Drums","Vocals","Bass Guitar","Acoustic Guitar","Piano"];
var KEYS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var FB = {
  apiKey:"AIzaSyC4HnnRcChcof_s4XKE173GFrGwmR1vxSg",
  authDomain:"elc-worship-schedule.firebaseapp.com",
  databaseURL:"https://elc-worship-schedule-default-rtdb.firebaseio.com",
  projectId:"elc-worship-schedule",
  storageBucket:"elc-worship-schedule.firebasestorage.app",
  messagingSenderId:"868888139963",
  appId:"1:868888139963:web:2d933464a111b2b17c319e"
};

var tries=0, timer=setInterval(function(){
  tries++;
  if(typeof firebase!=="undefined"&&firebase.initializeApp){
    clearInterval(timer);
    try{
      if(!firebase.apps.length) firebase.initializeApp(FB);
      db=firebase.database();
      ref=db.ref("worship");
      fbReady=true;
      document.getElementById("synctxt").textContent="✓ Connected";
      db.ref(".info/connected").on("value",function(s){
        document.getElementById("synctxt").textContent=s.val()?"✓ Connected":"✗ Offline";
      });
    }catch(e){
      document.getElementById("synctxt").textContent="✗ "+e.message;
    }
    start();
  }else if(tries>40){
    clearInterval(timer);
    document.getElementById("synctxt").textContent="✗ Firebase failed";
    start();
  }
},500);

function uid(){return sessionStorage.getItem("uid")}
function uname(){return sessionStorage.getItem("name")}
function urole(){return sessionStorage.getItem("role")}
function uinst(){return sessionStorage.getItem("inst")||""}

function isAdmin(){var r=urole();return r==="admin"||r==="co-admin"}

function render(h){document.getElementById("main").innerHTML=h}

function setNav(tabs){
  document.getElementById("mainnav").innerHTML=tabs.map(function(t){
    return '<button class="'+(t[0]===tab?"active":"")+(t[0]==="logout"?" sec":"")+
      '" onclick="goTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join("");
}

function setHeader(){
  if(uname()){
    var r=urole(), icon=r==="admin"?"👑":r==="co-admin"?"⭐":"👤";
    document.getElementById("uinfo").textContent=icon+" "+uname()+" ("+r+")";
  }else{
    document.getElementById("uinfo").textContent="";
  }
}

function goTab(t){
  if(t==="logout"){logout();return;}
  tab=t; start();
}

function start(){
  setHeader();
  if(!uid()){showLogin();return;}
  if(!uinst()){showInst();return;}
  if(tab==="home") showHome();
  else if(tab==="manage") showManage();
  else if(tab==="plan") showPlan();
  else if(tab==="songs") showSongs();
  else if(tab==="my") showMy();
  else if(tab==="avail") showAvail();
  else if(tab==="chat") showChat();
  else if(tab==="team") showTeam();
  else showHome();
}

function adminTabs(){return[["home","Home"],["manage","👥 Users"],["plan","Plan"],["songs","Songs"],["chat","Chat"],["team","Team"],["logout","Logout"]]}
function memberTabs(){return[["home","Home"],["my","Services"],["songs","Songs"],["avail","Off"],["chat","Chat"],["logout","Logout"]]}

function logout(){sessionStorage.clear();tab="home";start();}

/* ===== LOGIN ===== */
function showLogin(){
  setNav([]);
  render('<div class="card" style="max-width:500px;margin:0 auto" id="logincard"><div class="msg-info">⏳ Checking database...</div></div>');
  
  if(!fbReady){
    document.getElementById("logincard").innerHTML='<h2>🎵 Worship Scheduler</h2><div class="msg-err">⏳ Firebase is loading. Please wait and refresh.</div>';
    return;
  }
  
  ref.child("users").once("value").then(function(snap){
    var users=snap.val()||{};
    var hasAdmin=Object.keys(users).some(function(k){
      return users[k].role==="admin"||users[k].role==="co-admin";
    });
    
    var html='<h2>🎵 Worship Scheduler</h2>';
    
    if(!hasAdmin){
      html+='<div class="msg-ok"><b>👑 Setup: Create Your Admin Account</b><br>You are the first user — you will be Admin.</div>'+
        '<input id="nm" placeholder="Full Name"><input id="em" type="email" placeholder="Email">'+
        '<input id="ph" type="tel" placeholder="Phone"><input id="pw" type="password" placeholder="Password (4+ chars)">'+
        '<button onclick="doSignup(true)" style="background:#28a745">Create Admin Account</button>'+
        '<div id="smsg"></div>';
    }else{
      html+='<div class="msg-info"><b>👤 Join the Team</b><br>Your account needs admin approval before signing in.</div>'+
        '<input id="nm" placeholder="Full Name"><input id="em" type="email" placeholder="Email">'+
        '<input id="ph" type="tel" placeholder="Phone"><input id="pw" type="password" placeholder="Password (4+ chars)">'+
        '<button onclick="doSignup(false)">Request to Join</button>'+
        '<div id="smsg"></div>';
    }
    
    html+='<div style="border-top:1px solid var(--line);margin:20px 0;padding-top:20px">'+
      '<h3 style="margin-top:0">🔑 Sign In</h3>'+
      '<input id="sn" placeholder="Your Name"><input id="sp" type="password" placeholder="Password">'+
      '<button class="sec" onclick="doSignin()">Sign In</button>'+
      '<div id="inmsg"></div></div>';
    
    if(!hasAdmin){
      html+='<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:12px">'+
        '<p style="font-size:12px;color:#999;margin:0 0 8px">Stuck? Clear old data:</p>'+
        '<button class="sec" style="color:#c62828;border-color:#c62828" onclick="doReset()">🗑 Clear All & Start Fresh</button>'+
        '<div id="rmsg"></div></div>';
    }
    
    document.getElementById("logincard").innerHTML=html;
  });
}

function doSignup(isFirst){
  var nm=(document.getElementById("nm").value||"").trim();
  var em=(document.getElementById("em").value||"").trim();
  var ph=(document.getElementById("ph").value||"").trim();
  var pw=(document.getElementById("pw").value||"");
  var msg=document.getElementById("smsg");
  
  if(!nm||!em||!ph||pw.length<4){msg.innerHTML='<div class="msg-err">❌ Fill all fields (password 4+ chars)</div>';return;}
  if(!fbReady){msg.innerHTML='<div class="msg-err">⏳ Firebase not ready</div>';return;}
  
  msg.innerHTML='<div class="msg-info">⏳ Creating account...</div>';
  
  var id="u_"+Math.random().toString(36).substr(2,9);
  ref.child("users/"+id).set({
    name:nm,email:em,phone:ph,pass:pw,
    role:isFirst?"admin":"member",
    status:"approved",  /* all auto-approved; admin manages via manage tab */
    inst:[],off:{},
    createdAt:Date.now()
  },function(err){
    if(err){msg.innerHTML='<div class="msg-err">❌ '+err.message+'</div>';}
    else{
      if(isFirst){
        msg.innerHTML='<div class="msg-ok">✅ Admin account created! Sign in below.</div>';
        alert("✅ Admin Account Created!\n\nNow sign in below with your name and password.");
      }else{
        msg.innerHTML='<div class="msg-ok">✅ Account created! Sign in below.</div>';
        alert("✅ Account created!\n\nSign in below.");
      }
    }
  });
}

function doSignin(){
  var nm=(document.getElementById("sn").value||"").trim();
  var pw=(document.getElementById("sp").value||"");
  var msg=document.getElementById("inmsg");
  
  if(!nm||!pw){msg.innerHTML='<div class="msg-err">❌ Enter name and password</div>';return;}
  if(!fbReady){msg.innerHTML='<div class="msg-err">⏳ Firebase not ready</div>';return;}
  
  msg.innerHTML='<div class="msg-info">⏳ Signing in...</div>';
  
  ref.child("users").once("value").then(function(snap){
    var users=snap.val()||{};
    var fk=null,fu=null;
    
    for(var k in users){
      if(users[k].name===nm){fk=k;fu=users[k];break;}
    }
    
    if(!fu){msg.innerHTML='<div class="msg-err">❌ Name not found</div>';return;}
    if(fu.pass!==pw){msg.innerHTML='<div class="msg-err">❌ Password incorrect</div>';return;}
    if(fu.status==="pending"){msg.innerHTML='<div class="msg-err">⏳ Awaiting admin approval</div>';return;}
    if(fu.status==="rejected"){msg.innerHTML='<div class="msg-err">❌ Account rejected by admin</div>';return;}
    
    sessionStorage.setItem("uid",fk);
    sessionStorage.setItem("name",fu.name);
    sessionStorage.setItem("role",fu.role);
    sessionStorage.setItem("inst",fu.inst&&fu.inst.length?fu.inst.join("|"):"");
    tab="home";
    start();
  });
}

function doReset(){
  if(!confirm("Delete ALL users and start fresh?")) return;
  ref.child("users").remove(function(err){
    var msg=document.getElementById("rmsg");
    if(err){msg.innerHTML='<div class="msg-err">❌ '+err.message+'</div>';}
    else{msg.innerHTML='<div class="msg-ok">✅ Cleared! Now create admin above.</div>';showLogin();}
  });
}

/* ===== INSTRUMENTS ===== */
function showInst(){
  setNav([]);
  var sel=uinst().split("|").filter(function(x){return x;});
  var h='<div class="card"><h2>🎸 Select Your Instruments</h2>';
  INST.forEach(function(n){
    h+='<span class="chip'+(sel.indexOf(n)>=0?" on":"")+'" onclick="tglInst(\''+n+'\')">'+n+'</span>';
  });
  h+='<button style="margin-top:20px" onclick="saveInst()">Continue</button></div>';
  render(h);
}
function tglInst(n){
  var sel=uinst().split("|").filter(function(x){return x;});
  var i=sel.indexOf(n);i>=0?sel.splice(i,1):sel.push(n);
  sessionStorage.setItem("inst",sel.join("|"));
  showInst();
}
function saveInst(){
  var sel=uinst().split("|").filter(function(x){return x;});
  if(!sel.length){alert("Pick at least one");return;}
  if(fbReady) ref.child("users/"+uid()).update({inst:sel});
  tab="home";start();
}

/* ===== HOME ===== */
function showHome(){
  setNav(isAdmin()?adminTabs():memberTabs());
  var role=urole();
  var icon=role==="admin"?"👑":role==="co-admin"?"⭐":"👤";
  render('<div class="card">'+
    '<h2>'+icon+' Welcome, '+uname()+'!</h2>'+
    '<p style="color:#999">'+uinst().replace(/\|/g,", ")+'</p>'+
    '</div>');
}

/* ===== USER MANAGEMENT (Admin) ===== */
function showManage(){
  setNav(adminTabs());
  render('<h2>👥 User Management</h2><div class="card">Loading...</div>');
  if(!fbReady) return;
  
  ref.child("users").once("value").then(function(snap){
    var users=snap.val()||{};
    var pending=[],approved=[];
    for(var k in users){
      var u=users[k]; u._id=k;
      if(u.status==="pending") pending.push(u);
      else if(u.status==="approved") approved.push(u);
    }
    
    var h='<h2>👥 User Management</h2>';
    
    if(pending.length){
      h+='<h3>⏳ Pending Requests ('+pending.length+')</h3>';
      pending.forEach(function(u){
        h+='<div class="card pending"><b>'+u.name+'</b>'+
          '<div style="font-size:12px;margin:8px 0;color:#666">📧 '+u.email+'<br>📱 '+u.phone+'</div>'+
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
          '<button class="green" style="margin:0" onclick="approveUser(\''+u._id+'\',\''+u.name+'\')">✓ Approve</button>'+
          '<button class="red" style="margin:0" onclick="rejectUser(\''+u._id+'\',\''+u.name+'\')">✗ Reject</button>'+
          '</div></div>';
      });
    }else{
      h+='<div class="card" style="color:#999">No pending requests</div>';
    }
    
    if(approved.length){
      h+='<h3>✓ Approved Members ('+approved.length+')</h3>';
      approved.forEach(function(u){
        var isCoA=u.role==="co-admin";
        h+='<div class="card approved"><b>'+
          (u.role==="admin"?"👑":isCoA?"⭐":"👤")+' '+u.name+'</b>'+
          '<div style="font-size:12px;color:#666;margin:4px 0">'+
          (u.inst&&u.inst.length?u.inst.join(", "):"No instruments")+'</div>';
        if(u.role!=="admin"){
          h+=isCoA?
            '<button class="sec" style="margin-top:8px" onclick="demote(\''+u._id+'\',\''+u.name+'\')">⬇ Remove Co-Admin</button>':
            '<button class="sec" style="margin-top:8px" onclick="promote(\''+u._id+'\',\''+u.name+'\')">⭐ Make Co-Admin</button>';
        }
        h+='</div>';
      });
    }
    
    render(h);
  });
}
function approveUser(id,name){
  ref.child("users/"+id).update({status:"approved"}).then(function(){
    alert("✅ "+name+" approved!");
    showManage();
  });
}
function rejectUser(id,name){
  if(!confirm("Reject "+name+"?")) return;
  ref.child("users/"+id).update({status:"rejected"}).then(function(){
    showManage();
  });
}
function promote(id,name){
  ref.child("users/"+id).update({role:"co-admin"}).then(function(){
    alert("⭐ "+name+" is now Co-Admin!");
    showManage();
  });
}
function demote(id,name){
  ref.child("users/"+id).update({role:"member"}).then(function(){
    alert(name+" is now Member");
    showManage();
  });
}

/* ===== PLAN (Admin) ===== */
function showPlan(){
  setNav(adminTabs());
  var h='<div class="card"><h2>Plan Service</h2>'+
    '<label>Type</label><select id="st"><option>Sunday</option><option>Practice</option><option>Friday Prayer</option><option>Special</option></select>'+
    '<label>Date</label><input type="date" id="sd">'+
    '<label>Time</label><input type="time" id="sm" value="10:00">'+
    '<button onclick="addSvc()">Add Service</button></div>';
  if(!fbReady){render(h);return;}
  ref.child("services").once("value").then(function(snap){
    var svcs=snap.val()||{};
    var keys=Object.keys(svcs).sort(function(a,b){return svcs[a].date>svcs[b].date?1:-1;});
    keys.forEach(function(k){
      var s=svcs[k];
      var slist=s.songs?Object.values(s.songs).map(function(t){return'<span style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;margin:2px">🎵 '+t+'</span>';}).join(''):'';
      h+='<div class="card"><b>'+s.name+'</b> <small style="color:#999">'+s.date+' '+s.time+'</small>'+
        (slist?'<div style="margin-top:6px">'+slist+'</div>':'')+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">'+
        '<button class="sec" onclick="editSvc(\''+k+'\')">👥 Team</button>'+
        '<button class="sec" onclick="editSvcSongs(\''+k+'\')">🎵 Songs</button>'+
        '</div></div>';
    });
    render(h);
  });
}
function addSvc(){
  var d=document.getElementById("sd").value;
  if(!d){alert("Pick a date");return;}
  var id="s_"+Math.random().toString(36).substr(2,9);
  ref.child("services/"+id).set({
    name:document.getElementById("st").value,
    date:d,time:document.getElementById("sm").value,slots:{},songs:{}
  }).then(showPlan);
}
function editSvc(id){
  setNav(adminTabs());
  render('<div class="card">Loading...</div>');
  ref.child("services/"+id).once("value").then(function(ss){
    var s=ss.val(); if(!s) return showPlan();
    ref.child("users").once("value").then(function(us){
      var users={},ud=us.val()||{};
      for(var k in ud){if(ud[k].status==="approved") users[k]=ud[k];}
      var h='<div class="card"><h2>'+s.name+'</h2><small style="color:#999">'+s.date+' at '+s.time+'</small>';
      if(s.songs&&Object.keys(s.songs).length){
        h+='<div style="margin:12px 0"><label><b>🎵 Songs</b></label>';
        for(var sk in s.songs){
          h+='<div style="background:var(--bg);padding:6px 10px;border-radius:4px;margin:4px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center">'+
            '<span>🎵 '+s.songs[sk]+'</span>'+
            '<button class="sec" style="width:60px;padding:4px;margin:0;font-size:11px" onclick="removeSvcSong(\''+id+'\',\''+sk+'\')">Remove</button></div>';
        }
        h+='</div>';
      }
      INST.forEach(function(ins){
        var assigned=s.slots&&s.slots[ins]?s.slots[ins]:{};
        h+='<div style="margin-top:14px;padding:12px;background:var(--bg);border-radius:6px"><label style="margin:0"><b>'+ins+'</b></label>';
        for(var uid in assigned){
          if(users[uid]){
            h+='<div style="background:var(--accent);color:#fff;padding:8px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;border-radius:4px;font-size:13px">'+
              '<span>✓ '+users[uid].name+'</span>'+
              '<button class="sec" style="width:60px;padding:4px;margin:0;font-size:11px;background:rgba(255,255,255,0.2);color:#fff;border:1px solid #fff" onclick="delAssign(\''+id+'\',\''+ins+'\',\''+uid+'\')">Remove</button></div>';
          }
        }
        h+='<select onchange="addAssign(\''+id+'\',\''+ins+'\',this.value);this.value=\'\'"><option value="">+ Add '+ins+'...</option>';
        for(var k in users){
          var u=users[k];
          if(u.inst&&u.inst.indexOf(ins)>=0&&!(assigned&&assigned[k])) h+='<option value="'+k+'">'+u.name+'</option>';
        }
        h+='</select></div>';
      });
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px">'+
        '<button onclick="editSvcSongs(\''+id+'\')">🎵 Assign Songs</button>'+
        '<button class="sec" onclick="showPlan()">← Back</button></div></div>';
      render(h);
    });
  });
}
function addAssign(sid,ins,uid){
  if(!uid) return;
  ref.child("services/"+sid+"/slots/"+ins+"/"+uid).set(true).then(function(){setTimeout(function(){editSvc(sid);},300);});
}
function delAssign(sid,ins,uid){
  ref.child("services/"+sid+"/slots/"+ins+"/"+uid).remove().then(function(){editSvc(sid);});
}
function editSvcSongs(sid){
  setNav(adminTabs());
  render('<div class="card">Loading...</div>');
  ref.child("services/"+sid).once("value").then(function(ss){
    var s=ss.val(); if(!s) return showPlan();
    ref.child("songs").once("value").then(function(songSnap){
      var allSongs=songSnap.val()||{};
      var assignedSongs=s.songs||{};
      var h='<div class="card"><h2>🎵 Setlist for '+s.name+'</h2><small style="color:#999">'+s.date+' at '+s.time+'</small>';
      h+='<div style="margin-top:14px"><label><b>Assigned Songs</b></label>';
      var hasSongs=false;
      for(var sk in assignedSongs){
        hasSongs=true;
        h+='<div style="display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:#fff;padding:8px 12px;border-radius:6px;margin:4px 0;font-size:13px">'+
          '<span>🎵 '+assignedSongs[sk]+'</span>'+
          '<button class="sec" style="width:60px;padding:4px;margin:0;font-size:11px;background:rgba(255,255,255,0.2);color:#fff;border:1px solid #fff" onclick="removeSvcSong(\''+sid+'\',\''+sk+'\')">Remove</button></div>';
      }
      if(!hasSongs) h+='<div style="color:#999;font-size:13px;padding:8px">No songs yet</div>';
      h+='</div>';
      var libKeys=Object.keys(allSongs);
      if(libKeys.length){
        h+='<label style="margin-top:16px"><b>Add from Library</b></label>'+
          '<select onchange="addSvcSong(\''+sid+'\',this.value,this.options[this.selectedIndex].text);this.value=\'\'">'+
          '<option value="">+ Pick from library...</option>';
        libKeys.forEach(function(k){
          if(!assignedSongs[k]) h+='<option value="'+k+'">'+allSongs[k].title+' ('+allSongs[k].key+')</option>';
        });
        h+='</select>';
      }
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px">'+
        '<button onclick="editSvc(\''+sid+'\')">← Team</button>'+
        '<button class="sec" onclick="showPlan()">← Services</button></div></div>';
      render(h);
    });
  });
}
function addSvcSong(sid,songId,title){
  if(!songId) return;
  ref.child("services/"+sid+"/songs/"+songId).set(title.split(' (')[0]).then(function(){editSvcSongs(sid);});
}
function removeSvcSong(sid,songId){
  ref.child("services/"+sid+"/songs/"+songId).remove().then(function(){editSvcSongs(sid);});
}

/* ===== SONGS ===== */

      '<div class="card"><h3>✏️ Add Song Manually</h3>'+
      '<input id="st" placeholder="Song Title">'+
      '<label>Key</label><select id="sk">'+KEYS.map(function(k){return'<option>'+k+'</option>';}).join("")+'</select>'+
      '<input id="snt" placeholder="Notes / Tempo / BPM">'+
      '<textarea id="schords" rows="3" placeholder="Chords (e.g. G - D - Em - C)"></textarea>'+
      '<textarea id="snc" rows="3" placeholder="Number Chart (e.g. 1 - 5 - 6m - 4)"></textarea>'+

        '<b style="font-size:15px">'+sg.title+'</b>'+
        '<small style="color:#999">Key: '+sg.key+(sg.notes?' · '+sg.notes:'')+'</small>';
      if(sg.chords) h+='<details><summary style="cursor:pointer;color:var(--accent)">🎸 Chords</summary><pre style="font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto;background:var(--bg);padding:8px;border-radius:4px">'+sg.chords+'</pre></details>';
      if(sg.numberChart) h+='<details><summary style="cursor:pointer;color:var(--accent)">🔢 Number Chart</summary><pre style="font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto;background:var(--bg);padding:8px;border-radius:4px">'+sg.numberChart+'</pre></details>';
      if(sg.lyrics) h+='<details><summary style="cursor:pointer;color:var(--accent)">📝 Lyrics</summary><pre style="font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto;background:var(--bg);padding:8px;border-radius:4px">'+sg.lyrics+'</pre></details>';

function searchSongOnline(){
  var q=(document.getElementById("sqry").value||"").trim();
  if(!q){alert("Enter a song title and artist");return;}
  var box=document.getElementById("search-result");
  box.innerHTML='<div style="padding:16px;text-align:center;color:#999">🔍 Searching for "'+q+'"...<br><small>Fetching lyrics, chords & number chart</small></div>';

  // Parse "Title Artist" — try splitting on common separators
  var parts=q.split(/\s+by\s+|\s*-\s*/i);
  var title=parts[0].trim();
  var artist=parts[1]?parts[1].trim():"";

  // Step 1: Search lyrics via lyrics.ovh (free, no key, CORS-enabled)
  var lyricsUrl="https://api.lyrics.ovh/v1/"+encodeURIComponent(artist||"worship")+"/"+encodeURIComponent(title);

  fetch(lyricsUrl)
  .then(function(r){return r.json();})
  .then(function(data){
    var lyrics=data.lyrics||"";

    // Step 2: Search chords via chords.db proxy (free)
    // Fallback: use chord progressions from a known worship song database
    fetchChordsAndShow(title, artist, lyrics, box, q);
  })
  .catch(function(){
    // Lyrics not found, still try chords
    fetchChordsAndShow(title, artist, "", box, q);
  });
}

function fetchChordsAndShow(title, artist, lyrics, box, originalQuery){
  // Use ultimate-guitar search via allorigins CORS proxy
  var ugUrl="https://api.allorigins.win/get?url="+encodeURIComponent(
    "https://www.ultimate-guitar.com/search.php?search_type=title&value="+encodeURIComponent(title)
  );

  fetch(ugUrl)
  .then(function(r){return r.json();})
  .then(function(data){
    // Parse the store data from UG page
    var html=data.contents||"";
    var match=html.match(/window\.UGAPP\.store\.page\s*=\s*({.+?});\s*<\/script>/s)||
               html.match(/data-content="([^"]+)"/);
    
    var chords="";
    var key="";
    var chordsLink="";
    
    // Try to extract song data
    try{
      if(match){
        var pageData=JSON.parse(match[1].replace(/&quot;/g,'"').replace(/&amp;/g,'&'));
        var results=(pageData.data&&pageData.data.results)||[];
        // Find chords tab
        for(var i=0;i<results.length;i++){
          if(results[i].type==="Chords"&&results[i].song_name.toLowerCase()===title.toLowerCase()){
            chordsLink=results[i].tab_url;
            key=results[i].tonality_name||"";
            break;
          }
        }
      }
    }catch(e){}
    
    showSongResult(box, title, artist, key, lyrics, chords, chordsLink, originalQuery);
  })
  .catch(function(){
    showSongResult(box, title, artist, "", lyrics, "", "", originalQuery);
  });
}

function showSongResult(box, title, artist, key, lyrics, chords, chordsLink, originalQuery){
  var hasContent=lyrics||chords||chordsLink;
  
  if(!hasContent){
    // Last fallback: show a helpful result with manual links
    box.innerHTML='<div style="background:var(--bg);padding:14px;border-radius:8px;margin-top:12px">'+
      '<b>🎵 '+title+'</b>'+(artist?'<br><small style="color:#999">by '+artist+'</small>':'')+
      '<div style="margin:12px 0;padding:10px;background:#fff3e0;border-radius:6px;font-size:13px">'+
      '<b>⚠️ Auto-fetch limited</b><br>Click links below to find chords/lyrics manually, then paste into the form:</div>'+
      '<div style="display:grid;gap:8px;margin:12px 0">'+
      '<a href="https://www.ultimate-guitar.com/search.php?search_type=title&value='+encodeURIComponent(title)+'" target="_blank" style="display:block;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink)">🎸 Find Chords on Ultimate Guitar</a>'+
      '<a href="https://genius.com/search?q='+encodeURIComponent(title+' '+artist)+'" target="_blank" style="display:block;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink)">📝 Find Lyrics on Genius</a>'+
      '<a href="https://www.worshipchords.com/search/?q='+encodeURIComponent(title)+'" target="_blank" style="display:block;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink)">🙏 Search on WorshipChords.com</a>'+
      '<a href="https://www.praisecharts.com/songs/search/?s='+encodeURIComponent(title)+'" target="_blank" style="display:block;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink)">🎼 Search on PraiseCharts.com</a>'+
      '</div>'+
      '<p style="font-size:12px;color:#999;margin:8px 0">Copy chords/lyrics from those sites, then use <b>Add Song Manually</b> below.</p>'+
      '<button onclick="prefillManual(\''+title.replace(/'/g,"\\'")+'\')" style="background:var(--accent)">✏️ Pre-fill Manual Form</button>'+
      '</div>';
    return;
  }
  
  var html='<div style="background:var(--bg);padding:14px;border-radius:8px;margin-top:12px">'+
    '<b style="font-size:15px">🎵 '+title+'</b>'+
    (artist?'<br><small style="color:#999">by '+artist+'</small>':'')+
    (key?'<div style="margin:8px 0"><b style="font-size:12px;color:#999">KEY: </b>'+key+'</div>':'')+
    (chordsLink?'<a href="'+chordsLink+'" target="_blank" style="display:inline-block;margin:8px 0;padding:6px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);font-size:13px">🎸 View Full Chords (Ultimate Guitar)</a><br>':'');

  if(lyrics){
    html+='<details open style="margin:8px 0"><summary style="cursor:pointer;color:var(--accent);font-size:13px;font-weight:bold">📝 Lyrics (found!)</summary>'+
      '<pre style="font-size:11px;white-space:pre-wrap;max-height:200px;overflow:auto;background:var(--card);padding:8px;border-radius:4px;margin-top:6px">'+
      escHtml(lyrics.substring(0,3000))+'</pre></details>';
  }
  
  html+='<div style="margin-top:14px;padding:12px;background:var(--card);border-radius:6px">'+
    '<b style="font-size:13px">Save to Library</b>'+
    '<input id="res-key" placeholder="Key (e.g. G)" value="'+escHtml(key)+'" style="margin-top:8px">'+
    '<input id="res-tempo" placeholder="Tempo / BPM">'+
    '<textarea id="res-chords" rows="3" placeholder="Paste chords here..."></textarea>'+
    '<textarea id="res-nc" rows="2" placeholder="Number chart (e.g. 1-5-6m-4)..."></textarea>'+
    '<button onclick="saveFromResult(\''+escJs(title)+'\',\''+escJs(artist)+'\')" style="background:#28a745;margin-top:8px">+ Save to Library</button></div>'+
    '</div>';
  
  box.innerHTML=html;
}

function prefillManual(title){
  var el=document.getElementById("st");
  if(el){el.value=title;el.scrollIntoView({behavior:"smooth"});}
}

function saveFromResult(title,artist){
  var key=(document.getElementById("res-key").value||"").trim()||"C";
  var tempo=(document.getElementById("res-tempo").value||"").trim();
  var chords=(document.getElementById("res-chords").value||"").trim();
  var nc=(document.getElementById("res-nc").value||"").trim();
  var lyricsEl=document.querySelector("#search-result pre");
  var lyrics=lyricsEl?lyricsEl.textContent:"";
  
  var id="sg_"+Math.random().toString(36).substr(2,9);
  ref.child("songs/"+id).set({
    title:title+(artist?" - "+artist:""),
    key:key,notes:tempo,chords:chords,numberChart:nc,lyrics:lyrics
  }).then(function(){
    alert("✅ Saved to library!");
    showSongs();
  });
}

function escHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escJs(s){
  return (s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}



function addSong(){
  var t=(document.getElementById("st").value||"").trim();
  if(!t){alert("Enter title");return;}
  ref.child("songs/sg_"+Math.random().toString(36).substr(2,9)).set({
    title:t,
    key:document.getElementById("sk").value,
    notes:document.getElementById("snt").value,
    chords:document.getElementById("schords").value,
    numberChart:document.getElementById("snc").value,
    lyrics:document.getElementById("sly").value
  }).then(showSongs);
}
function delSong(id){
  ref.child("songs/"+id).remove().then(showSongs);
}

/* ===== MY SERVICES (Member) ===== */
function showMy(){
  setNav(memberTabs());
  render('<h2>Your Services</h2><div class="card">Loading...</div>');
  if(!fbReady) return;
  
  var me=uid();
  ref.child("services").once("value").then(function(snap){
    var svcs=snap.val()||{};
    var h='<h2>Your Services</h2>';
    var found=false;
    
    var keys=Object.keys(svcs).sort(function(a,b){return svcs[a].date>svcs[b].date?1:-1;});
    keys.forEach(function(k){
      var s=svcs[k];
      if(!s.slots) return;
      for(var ins in s.slots){
        if(s.slots[ins]&&s.slots[ins][me]){
          found=true;
          h+='<div class="card"><b>'+s.name+'</b><br><small style="color:#999">'+s.date+' '+s.time+'</small><br>'+
            '<small style="background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px">'+ins+'</small></div>';
        }
      }
    });
    if(!found) h='<h2>Your Services</h2><div class="card" style="text-align:center;color:#999">No services assigned yet</div>';
    render(h);
  });
}

/* ===== AVAILABILITY (Member) ===== */
function showAvail(){
  setNav(memberTabs());
  if(!fbReady){render('<div class="card">Loading...</div>');return;}
  
  ref.child("users/"+uid()+"/off").once("value").then(function(snap){
    selDays=snap.val()||{};
    renderCal();
  });
}
function renderCal(){
  var today=new Date(), year=today.getFullYear();
  var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var h='<h2>Off Days</h2><p style="color:#999;font-size:12px">Tap dates to mark unavailable</p>';
  
  for(var yr=year;yr<=year+1;yr++){
    h+='<h3 style="text-align:center">'+yr+'</h3>';
    for(var m=0;m<12;m++){
      var dim=new Date(yr,m+1,0).getDate(), fd=new Date(yr,m,1).getDay();
      h+='<div style="margin-bottom:16px"><div style="font-weight:bold;font-size:13px;margin-bottom:4px">'+MN[m]+'</div>'+
        '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
      ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){
        h+='<div style="text-align:center;font-size:10px;font-weight:bold;color:#999">'+d+'</div>';
      });
      for(var e=0;e<fd;e++) h+='<div></div>';
      for(var day=1;day<=dim;day++){
        var ds=yr+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        var isSel=!!selDays[ds];
        var isToday=(yr===today.getFullYear()&&m===today.getMonth()&&day===today.getDate());
        var style='cursor:pointer;padding:4px;text-align:center;border-radius:4px;border:'+
          (isToday?'2px solid var(--accent)':'1px solid var(--line)')+
          ';background:'+(isSel?'var(--accent)':'var(--bg)')+
          ';color:'+(isSel?'#fff':'var(--ink)');
        h+='<div style="'+style+'" onclick="tglDay(\''+ds+'\')">'+day+'</div>';
      }
      h+='</div></div>';
    }
  }
  h+='<button onclick="saveOff()">Save Off Days</button>'+
    '<button class="sec" onclick="clearOff()" style="margin-top:4px">Clear All</button>';
  render(h);
}
function tglDay(ds){selDays[ds]?delete selDays[ds]:(selDays[ds]=true);renderCal();}
function saveOff(){
  ref.child("users/"+uid()+"/off").set(selDays).then(function(){alert("Saved!");showAvail();});
}
function clearOff(){
  if(confirm("Clear all off days?")){ selDays={}; renderCal(); }
}

/* ===== CHAT ===== */
function showChat(){
  setNav(isAdmin()?adminTabs():memberTabs());
  render('<div class="card"><h2>Team Chat</h2>'+
    '<div id="chatbox" style="border:1px solid var(--line);height:220px;overflow-y:auto;padding:10px;background:var(--bg);border-radius:6px;margin-bottom:10px">Loading...</div>'+
    '<div style="display:flex;gap:8px">'+
    '<input id="cmsg" placeholder="Message..." style="margin:0;flex:1">'+
    '<button onclick="sendMsg()" style="width:80px;margin:0">Send</button></div></div>');
  
  if(!fbReady) return;
  
  ref.child("messages").orderByChild("time").limitToLast(50).on("value",function(snap){
    var box=document.getElementById("chatbox");
    if(!box) return;
    var msgs=[];
    if(snap.val()){for(var k in snap.val()) msgs.push(snap.val()[k]);}
    box.innerHTML=msgs.map(function(m){
      return '<div class="msg"><b>'+m.name+'</b> <span style="color:#999;font-size:10px">'+
        new Date(m.time).toLocaleTimeString()+'</span><br>'+m.text+'</div>';
    }).join("");
    box.scrollTop=box.scrollHeight;
  });
}
function sendMsg(){
  var tx=(document.getElementById("cmsg").value||"").trim();
  if(!tx||!fbReady) return;
  ref.child("messages").push({name:uname(),text:tx,time:Date.now()});
  document.getElementById("cmsg").value="";
}
