<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worship Scheduler</title>
<style>
:root { --bg: #f6f4ef; --card: #fff; --ink: #22201c; --accent: #7b5e3b; --line: #e3ded4; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1917; --card: #252220; --ink: #f0ece5; --accent: #c9a877; --line: #3a3532; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px system-ui, sans-serif; }
header { background: var(--card); padding: 12px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 18px; }
h2 { margin: 10px 0; font-size: 16px; }
h3 { margin: 12px 0 8px 0; font-size: 14px; }
main { max-width: 800px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); padding: 14px; margin: 12px 0; border-radius: 8px; }
input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
button { background: var(--accent); color: #fff; border: 0; padding: 10px; border-radius: 6px; cursor: pointer; margin: 4px 0; width: 100%; }
button.sec { background: transparent; color: var(--accent); border: 1px solid var(--line); }
label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; color: #999; }
.chip { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 20px; margin: 4px; cursor: pointer; background: var(--bg); font-size: 13px; }
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
nav { padding: 8px; display: flex; gap: 4px; overflow-x: auto; background: var(--card); border-bottom: 1px solid var(--line); }
nav button { margin: 0; padding: 8px 12px; width: auto; font-size: 13px; }
.status { font-size: 11px; color: #999; margin-top: 4px; }
.error-box { background: #ffebee; color: #c62828; padding: 10px; border-radius: 6px; margin: 8px 0; border-left: 4px solid #c62828; }
.success-box { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 6px; margin: 8px 0; border-left: 4px solid #2e7d32; }
.info-box { background: #fff3e0; color: #e65100; padding: 10px; border-radius: 6px; margin: 8px 0; border-left: 4px solid #ff9800; }
</style>
</head>
<body>

<header>
  <h1>🎵 Worship Scheduler</h1>
  <div id="user-info" style="font-size: 12px; color: #999; margin-top: 4px;"></div>
  <div class="status" id="sync-text">Initializing Firebase...</div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<script async defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script async defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
var db, refDB;
var firebaseReady = false;
var INST = ["Drums", "Vocals", "Bass Guitar", "Acoustic Guitar", "Piano"];
var user = null;
var tab = "dash";

const firebaseConfig = {
  apiKey: "AIzaSyC4HnnRcChcof_s4XKE173GFrGwmR1vxSg",
  authDomain: "elc-worship-schedule.firebaseapp.com",
  databaseURL: "https://elc-worship-schedule-default-rtdb.firebaseio.com",
  projectId: "elc-worship-schedule",
  storageBucket: "elc-worship-schedule.firebasestorage.app",
  messagingSenderId: "868888139963",
  appId: "1:868888139963:web:2d933464a111b2b17c319e"
};

function log(msg) {
  console.log("[Worship] " + msg);
}

function initFirebase() {
  try {
    log("Attempting to initialize Firebase...");
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
      log("Firebase app initialized");
    }
    db = firebase.database();
    refDB = db.ref("worship");
    firebaseReady = true;
    log("✓ Firebase is ready!");
    document.getElementById("sync-text").textContent = "✓ Firebase Connected";
    
    db.ref(".info/connected").on("value", function(snap) {
      if (snap.val() === true) {
        document.getElementById("sync-text").textContent = "✓ Firebase Connected";
      } else {
        document.getElementById("sync-text").textContent = "✗ Offline";
      }
    });
    
    show();
  } catch (e) {
    log("❌ Firebase error: " + e.message);
    document.getElementById("sync-text").textContent = "❌ Firebase Error: " + e.message;
  }
}

var checkCount = 0;
var firebaseCheck = setInterval(function() {
  checkCount++;
  if (typeof firebase !== 'undefined' && firebase.initializeApp) {
    clearInterval(firebaseCheck);
    log("Firebase library loaded, initializing...");
    initFirebase();
  } else if (checkCount > 50) {
    clearInterval(firebaseCheck);
    log("❌ Firebase failed to load after 25 seconds");
    document.getElementById("sync-text").textContent = "❌ Firebase Failed to Load";
    show();
  }
}, 500);

function getMe() {
  return sessionStorage.getItem("uid") ? { uid: sessionStorage.getItem("uid") } : null;
}

function render(h) {
  document.getElementById("main").innerHTML = h;
  if (sessionStorage.getItem("name")) {
    var role = sessionStorage.getItem("role") || "?";
    var roleIcon = role === "admin" ? "👑" : (role === "co-admin" ? "⭐" : "👤");
    document.getElementById("user-info").textContent = roleIcon + " " + sessionStorage.getItem("name");
  }
}

function nav(tabs) {
  var h = "";
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i][0];
    var l = tabs[i][1];
    var cls = t === tab ? "active" : "";
    h += '<button class="' + cls + '" onclick="tab=\'' + t + '\';show()">' + l + '</button>';
  }
  document.getElementById("nav").innerHTML = h;
}

function show() {
  user = getMe();
  
  if (!user) {
    login();
  } else if (!sessionStorage.getItem("inst")) {
    inst();
  } else {
    if (tab === "dash") dash();
    else if (tab === "manage") manage();
    else if (tab === "plan") plan();
    else if (tab === "songs") songs();
    else if (tab === "my") my();
    else if (tab === "avail") avail();
    else if (tab === "chat") chat();
    else if (tab === "team") team();
    else dash();
  }
}

function login() {
  var h = '<div class="card" style="max-width: 500px; margin: 0 auto">' +
    '<h2>🎵 Worship Scheduler</h2>' +
    
    '<div style="margin: 20px 0">' +
    '<h3 style="margin-top: 0; color: #28a745">📝 Create Admin Account</h3>' +
    '<div class="info-box"><b>First person to sign up becomes Admin</b></div>' +
    '<input type="text" id="nm" placeholder="Full Name" style="margin-top: 0">' +
    '<input type="email" id="em" placeholder="Email" />' +
    '<input type="tel" id="ph" placeholder="Phone Number" />' +
    '<input type="password" id="pw" placeholder="Password (4+ chars)" />' +
    '<button onclick="signup()" style="margin-top: 12px; background: #28a745">Create Account</button>' +
    '<div id="signup-msg"></div>' +
    '</div>' +
    
    '<div style="border-top: 1px solid var(--line); margin: 20px 0; padding-top: 20px">' +
    '<h3 style="margin-top: 0">🔑 Sign In</h3>' +
    '<input type="text" id="nm2" placeholder="Your Name" style="margin-top: 0">' +
    '<input type="password" id="pw2" placeholder="Password">' +
    '<button class="sec" onclick="signin()" style="border: 2px solid var(--accent); color: var(--accent)">Sign In</button>' +
    '<div id="signin-msg"></div>' +
    '</div>' +
    '</div>';
  
  nav([]);
  render(h);
  
  log("Firebase ready: " + firebaseReady);
}

function signup() {
  var nm = document.getElementById("nm").value.trim();
  var em = document.getElementById("em").value.trim();
  var ph = document.getElementById("ph").value.trim();
  var pw = document.getElementById("pw").value;
  
  log("SIGNUP: name=" + nm + ", email=" + em + ", phone=" + ph + ", pw_len=" + pw.length);
  
  if (!nm) return showMsg("signup-msg", "❌ Enter your name", "error");
  if (!em) return showMsg("signup-msg", "❌ Enter your email", "error");
  if (!ph) return showMsg("signup-msg", "❌ Enter your phone", "error");
  if (pw.length < 4) return showMsg("signup-msg", "❌ Password must be 4+ chars", "error");
  
  if (!firebaseReady) {
    return showMsg("signup-msg", "⏳ Firebase not ready yet. Wait a moment.", "error");
  }
  
  showMsg("signup-msg", "⏳ Creating account...", "info");
  
  var uid = "u_" + Math.random().toString().substr(2, 9);
  log("Generated UID: " + uid);
  
  // Check if admin exists
  refDB.child("users").once("value").then(function(snap) {
    var hasAdmin = false;
    var userData = snap.val();
    log("Users snapshot: " + (userData ? "exists" : "null"));
    
    if (userData) {
      for (var key in userData) {
        if (userData[key].role === "admin" || userData[key].role === "co-admin") {
          hasAdmin = true;
          log("Found existing admin");
          break;
        }
      }
    }
    
    var role = hasAdmin ? "member" : "admin";
    log("Assigning role: " + role + ", hasAdmin: " + hasAdmin);
    
    var newUser = {
      name: nm,
      email: em,
      phone: ph,
      pass: pw,
      role: role,
      status: "approved",
      inst: [],
      off: {},
      createdAt: new Date().getTime()
    };
    
    log("Writing user to: /worship/users/" + uid);
    
    refDB.child("users/" + uid).set(newUser, function(error) {
      if (error) {
        log("❌ Firebase write error: " + error.message);
        showMsg("signup-msg", "❌ Error: " + error.message, "error");
      } else {
        log("✓ User created successfully!");
        showMsg("signup-msg", "✓ Account created! Now sign in below.", "success");
        
        if (role === "admin") {
          alert("✅ Admin Account Created!\n\n👑 You are now the Admin\n\nPlease sign in below to continue.");
        } else {
          alert("✓ Member account created!\nWaiting for admin approval.");
        }
      }
    });
    
  }).catch(function(e) {
    log("❌ Error checking users: " + e.message);
    showMsg("signup-msg", "❌ Error: " + e.message, "error");
  });
}

function signin() {
  var nm = document.getElementById("nm2").value.trim();
  var pw = document.getElementById("pw2").value;
  
  log("SIGNIN: name=" + nm + ", pw_len=" + pw.length);
  
  if (!nm) return showMsg("signin-msg", "❌ Enter your name", "error");
  if (!pw) return showMsg("signin-msg", "❌ Enter your password", "error");
  
  if (!firebaseReady) {
    return showMsg("signin-msg", "⏳ Firebase not ready yet. Wait a moment.", "error");
  }
  
  showMsg("signin-msg", "⏳ Signing in...", "info");
  
  refDB.child("users").once("value").then(function(snap) {
    var allUsers = snap.val();
    log("Checking " + (allUsers ? Object.keys(allUsers).length : 0) + " users");
    
    if (!allUsers) {
      return showMsg("signin-msg", "❌ No accounts found. Create one first.", "error");
    }
    
    var foundUser = null;
    var foundKey = null;
    
    for (var key in allUsers) {
      if (allUsers[key].name === nm) {
        foundUser = allUsers[key];
        foundKey = key;
        log("Found user: " + key);
        break;
      }
    }
    
    if (!foundUser) {
      return showMsg("signin-msg", "❌ Name not found", "error");
    }
    
    if (foundUser.pass !== pw) {
      return showMsg("signin-msg", "❌ Password incorrect", "error");
    }
    
    if (foundUser.status === "pending") {
      return showMsg("signin-msg", "⏳ Account pending admin approval", "error");
    }
    
    log("✓ Login successful!");
    sessionStorage.setItem("uid", foundKey);
    sessionStorage.setItem("name", foundUser.name);
    sessionStorage.setItem("role", foundUser.role);
    sessionStorage.setItem("inst", foundUser.inst && foundUser.inst.length ? foundUser.inst.join("|") : "");
    
    show();
    
  }).catch(function(e) {
    log("❌ Error: " + e.message);
    showMsg("signin-msg", "❌ Error: " + e.message, "error");
  });
}

function showMsg(elemId, msg, type) {
  var elem = document.getElementById(elemId);
  if (!elem) return;
  
  var cls = type === "error" ? "error-box" : (type === "success" ? "success-box" : "info-box");
  elem.innerHTML = '<div class="' + cls + '">' + msg + '</div>';
}

function logout() {
  sessionStorage.clear();
  show();
}

function inst() {
  var h = '<div class="card"><h2>Pick Your Instruments</h2>';
  var selected = sessionStorage.getItem("inst") ? sessionStorage.getItem("inst").split("|").filter(function(x) { return x; }) : [];
  
  for (var i = 0; i < INST.length; i++) {
    var sel = selected.indexOf(INST[i]) >= 0 ? " on" : "";
    h += '<span class="chip' + sel + '" onclick="tglInst(\'' + INST[i] + '\')">' + INST[i] + '</span>';
  }
  h += '<button style="margin-top: 20px" onclick="doneInst()">Done</button></div>';
  
  nav([]);
  render(h);
}

function tglInst(n) {
  var selected = sessionStorage.getItem("inst") ? sessionStorage.getItem("inst").split("|").filter(function(x) { return x; }) : [];
  var idx = selected.indexOf(n);
  idx >= 0 ? selected.splice(idx, 1) : selected.push(n);
  sessionStorage.setItem("inst", selected.join("|"));
  inst();
}

function doneInst() {
  var selected = sessionStorage.getItem("inst") ? sessionStorage.getItem("inst").split("|").filter(function(x) { return x; }) : [];
  if (!selected.length) return alert("Select at least one instrument");
  
  var uid = sessionStorage.getItem("uid");
  if (firebaseReady) {
    refDB.child("users/" + uid).update({ inst: selected });
  }
  tab = "dash";
  show();
}

function dash() {
  var role = sessionStorage.getItem("role");
  var tabs = role === "admin" || role === "co-admin"
    ? [["dash", "Home"], ["manage", "👥 Users"], ["plan", "Plan"], ["logout", "Logout"]]
    : [["dash", "Home"], ["my", "Services"], ["logout", "Logout"]];
  
  if (tab === "logout") {
    logout();
    return;
  }
  
  var h = '<div class="card"><h2>Welcome, ' + sessionStorage.getItem("name") + '!</h2>' +
    '<p style="color: #999">' + (sessionStorage.getItem("inst") || "no instruments") + '</p></div>';
  
  nav(tabs);
  render(h);
}

function manage() {
  var tabs = [["dash", "Home"], ["manage", "👥 Users"], ["plan", "Plan"], ["logout", "Logout"]];
  var h = '<h2>👥 User Management</h2><div class="card">No pending approvals</div>';
  nav(tabs);
  render(h);
}

function plan() {
  var tabs = [["dash", "Home"], ["manage", "👥 Users"], ["plan", "Plan"], ["logout", "Logout"]];
  var h = '<h2>Plan Services</h2><div class="card">Service planning coming soon</div>';
  nav(tabs);
  render(h);
}

function my() {
  var tabs = [["dash", "Home"], ["my", "Services"], ["logout", "Logout"]];
  var h = '<h2>Your Services</h2><div class="card">No services assigned yet</div>';
  nav(tabs);
  render(h);
}

function avail() {
  var tabs = [["dash", "Home"], ["my", "Services"], ["logout", "Logout"]];
  var h = '<h2>Availability</h2><div class="card">Coming soon</div>';
  nav(tabs);
  render(h);
}

function chat() {
  var tabs = [["dash", "Home"], ["logout", "Logout"]];
  var h = '<h2>Chat</h2><div class="card">Coming soon</div>';
  nav(tabs);
  render(h);
}

function team() {
  var tabs = [["dash", "Home"], ["logout", "Logout"]];
  var h = '<h2>Team Members</h2><div class="card">No members yet</div>';
  nav(tabs);
  render(h);
}

function songs() {
  var tabs = [["dash", "Home"], ["logout", "Logout"]];
  var h = '<h2>Songs</h2><div class="card">Coming soon</div>';
  nav(tabs);
  render(h);
}

show();
</script>
</body>
</html>
