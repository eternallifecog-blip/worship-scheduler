name: Send Reminders

on:
  schedule:
    - cron: '0 * * * *'   # runs every hour
  workflow_dispatch:        # allow manual trigger from Actions tab

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix .

      - name: Send reminder emails
        run: node .github/scripts/send-reminders.js
        env:
          FIREBASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_URL || secrets.FIREBASE_URL_SANDBOX }}
          FIREBASE_SECRET: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SECRET || secrets.FIREBASE_SECRET_SANDBOX }}
          EMAILJS_SERVICE_ID:  ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_PUBLIC_KEY:  ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
