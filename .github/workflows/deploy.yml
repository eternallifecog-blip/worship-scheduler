name: Deploy

on:
  push:
    branches:
      - main   # → deploys to Production (gh-pages)
      - dev    # → deploys to Sandbox   (gh-pages-dev)

# Required so the workflow can push to gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set target branch
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_branch=gh-pages" >> $GITHUB_OUTPUT
          else
            echo "target_branch=gh-pages-dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  ./
          publish_branch: ${{ steps.env.outputs.target_branch }}
          exclude_assets: '.github'
